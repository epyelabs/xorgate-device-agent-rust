[workspace]
resolver = "2"
members = [
  "crates/xorgate-core",
  "crates/xorgate-hal",
  "crates/xorgate-cloud",
  "crates/xorgate-agent",
  "crates/xorgate-replay",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
repository = "https://github.com/epyelabs/xorgate-device-agent-rust"

[workspace.dependencies]
# `version` alongside `path`: cargo-deny `[bans] wildcards = "deny"` treats a
# bare path dependency as a wildcard requirement. Keep in step with
# [workspace.package].version.
xorgate-core = { path = "crates/xorgate-core", version = "0.1.1" }
xorgate-hal = { path = "crates/xorgate-hal", version = "0.1.1" }
xorgate-cloud = { path = "crates/xorgate-cloud", version = "0.1.1" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `raw_value`: `telemetry::JsNumber` emits V8's number text verbatim.
# `float_roundtrip`: parse every JS-printed double to the exact f64 V8 had
# (without it ~1 in 5 random doubles came back 1 ulp off; review-wp5/wp6 S5).
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-journald = "0.3"
clap = { version = "4", features = ["derive"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "logging", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
sd-notify = "0.5"
# Phase 4 WP2 (Q3): `term` for `nix::pty::openpty` (the AT-port pty tests);
# WP5: `net` for the interface lookups (`ifaceForIp`).
nix = { version = "0.31", features = ["fs", "signal", "process", "user", "term", "net"] }
libc = "0.2"
gstreamer = { version = "0.25", features = ["v1_22"] }
# WP7 (phase-2/wp7-replay): gzip tapes (pure-Rust miniz_oxide backend) and the
# rig tolerance table.
flate2 = "1"
toml = "0.9"
# Phase 2 WP5 (IoT creds + S3 PUT): HTTPS over rustls/aws-lc-rs with the
# platform verifier, HTTP/1.1 only and no env proxies (node:https parity);
# `stream` for the idle-timeout body wrapper. Hand-rolled SigV4 (no aws-sdk, Q5).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
bytes = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
# Phase 4 WP1 (Q3): the agent drives the status LED through the GPIO character
# device (one held line request, consumer "xorgate-rs"); the CLI + systemd hooks keep `pinctrl`.
gpiocdev = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# Phase 2 WP1 (spine): tokio-util `rt` already above; sha2/hex shared with WP5
# (settings.json fingerprint = readSettingsHash for WP3).
# Phase 4 WP5 (Q3): the `manage` TUI (ink → ratatui); `EventStream` is a
# futures-core Stream (futures-core already in the lockfile via tokio-util).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3"
# Already in the lockfile via ratatui: the TUI's word-wrap/truncate widths.
unicode-width = "0.2"

# Release profile per plan README §7: fat LTO, one codegen unit, stripped
# symbols but line tables kept for backtraces. `panic = "abort"` is deliberately
# NOT set until Phase 2 (panics must stay visible early).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
debug = "line-tables-only"
