# /etc/NetworkManager/conf.d/99-sim7600-unmanaged.conf
#
# The SIM7600 RNDIS interface (usb0) is owned EXCLUSIVELY by sim7600-lte.sh:
# it runs its own dhclient, verifies WAN connectivity end-to-end, and tears
# the interface down/up around modem-level recovery.
#
# Without this file NetworkManager auto-creates a "Wired connection" profile
# for usb0 and races the daemon's dhclient for the modem's internal DHCP
# lease. That leaves stale/duplicate addresses ("Error: ipv4: Address already
# assigned") and noprefixroute entries behind after an LTE outage — traffic
# then sources from an address the modem's NAT no longer maps, and the link
# never recovers until a reboot wipes host network state.
#
# Install:  sudo cp 99-sim7600-unmanaged.conf /etc/NetworkManager/conf.d/
#           sudo nmcli general reload conf
# (then delete any leftover profile: nmcli connection delete "Wired connection 2")

[keyfile]
unmanaged-devices=interface-name:usb0
