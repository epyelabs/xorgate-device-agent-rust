[package]
name = "xorgate-replay"
description = "Record/replay harness for the xorgate agent port: tape inspect/synth, rig player, capture diff (plan phase-2 §Record/replay)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xorgate-replay"
path = "src/main.rs"

[dependencies]
xorgate-hal = { workspace = true }
xorgate-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rumqttc = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
nix = { workspace = true, features = ["term", "fs", "inotify"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Phase 3 (WP6): fake IoT creds + SigV4-verifying fake S3 (aws.rs) — all
# already in the workspace lock (xorgate-cloud), no new crate.
tokio-rustls = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
