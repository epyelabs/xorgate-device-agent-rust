[package]
name = "xorgate-agent"
description = "The xorgate device agent binary (`xorgate-rs`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "xorgate-rs"
path = "src/main.rs"

[dependencies]
xorgate-core = { workspace = true }
xorgate-hal = { workspace = true }
xorgate-cloud = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }
sd-notify = { workspace = true }
nix = { workspace = true }
gstreamer = { workspace = true }
# Phase 7e replay: gunzip the scenario trace, gzip seeded telemetry segments.
flate2 = { workspace = true }
# Phase 3 WP3: the uploader hands `ObjectPut` its bodies as `Bytes`.
bytes = { workspace = true }
# Phase 3 WP4: setpriority(2) for the capture child (nice 10, video-capture.ts:690).
libc = { workspace = true }
# Phase 4 WP4: `xorgate-rs update` verifies the tarball against its .sha256 sidecar (Q14).
sha2 = { workspace = true }
# Phase 4 WP5 (Q3): `xorgate-rs manage` (ratatui over crossterm).
ratatui = { workspace = true }
crossterm = { workspace = true }
futures-core = { workspace = true }
unicode-width = { workspace = true }

[features]
# Phase 7c WP3: the IMU reader's TEST-ONLY socket transport
# (`imu_reader/test_bus.rs`). Enabled ONLY by the self dev-dependency below,
# i.e. in `cargo test` / `clippy --all-targets` builds; `cargo build` (rig,
# tarball, CI release) never has it.
imu-test-bus = []

[dev-dependencies]
# Phase 7c WP3: `tests/imu_reader.rs` runs the real `xorgate-rs __imu-reader`
# over the test bus.
xorgate-agent = { path = ".", features = ["imu-test-bus"] }
xorgate-hal = { workspace = true, features = ["test-support"] }
# `start_paused` tests of the spine (tokio::time::pause); `net` for the stub broker.
tokio = { workspace = true, features = ["test-util", "net"] }
# WP1 follow-up: `tests/commands.rs` drives the REAL MQTT client against the
# stub broker of `xorgate-cloud/tests/support/stub_broker.rs` (#[path] include).
# All already workspace deps of xorgate-cloud; no new crate in the lockfile.
rumqttc = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
bytes = { workspace = true }
# Phase 3 WP2: decompress + hash finalized segments in tests/recording_telemetry.rs.
flate2 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
