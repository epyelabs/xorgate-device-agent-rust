[package]
name = "xorgate-agent"
description = "The xorgate device agent binary (`xorgate-rs`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "xorgate-rs"
path = "src/main.rs"

[dependencies]
xorgate-core = { workspace = true }
xorgate-hal = { workspace = true }
xorgate-cloud = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }
sd-notify = { workspace = true }
nix = { workspace = true }
gstreamer = { workspace = true }
# Phase 3 WP3: the uploader hands `ObjectPut` its bodies as `Bytes`.
bytes = { workspace = true }
# Phase 3 WP4: setpriority(2) for the capture child (nice 10, video-capture.ts:690).
libc = { workspace = true }

[dev-dependencies]
# `start_paused` tests of the spine (tokio::time::pause); `net` for the stub broker.
tokio = { workspace = true, features = ["test-util", "net"] }
# WP1 follow-up: `tests/commands.rs` drives the REAL MQTT client against the
# stub broker of `xorgate-cloud/tests/support/stub_broker.rs` (#[path] include).
# All already workspace deps of xorgate-cloud; no new crate in the lockfile.
rumqttc = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
bytes = { workspace = true }
# Phase 3 WP2: decompress + hash finalized segments in tests/recording_telemetry.rs.
flate2 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
