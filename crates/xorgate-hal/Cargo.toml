[package]
name = "xorgate-hal"
description = "Linux edges of the xorgate device agent: sysfs/procfs readers, subprocess runners, atomic file writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xorgate-core = { workspace = true }
tokio = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
gpiocdev = { workspace = true }

[dev-dependencies]
# `test-util`: tokio::time::pause() for the LED pattern timelines (Phase 4 WP1)
# and `start_paused` for the AT-session timeouts (Phase 4 WP2).
tokio = { workspace = true, features = ["test-util"] }
