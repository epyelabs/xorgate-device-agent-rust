# BENCH-ONLY drop-in for xorgate-agent-rs.service — Phase 0–5 scaffolding.
#
# Installed by scripts/bench/install.sh at
#   /etc/systemd/system/xorgate-agent-rs.service.d/90-bench-dev.conf
# on the bench CM5 ONLY. It is NOT shipped by the Phase 5 converter
# (install-rs.sh) and must never land on a fielded device: it lets the Rust
# agent run NEXT TO the JS prod agent on one box by giving it a different
# identity and a different state dir (plan decision D0.1).
#
# What it changes versus the shipped unit:
#   - Conflicts=: NOT handled here. systemd cannot reset a dependency list
#     from a drop-in (an empty "Conflicts=" is silently ignored — verified on
#     systemd 252, bench 2026-10-08), so scripts/bench/install.sh comments the
#     `Conflicts=xorgate-agent.service` line out of the INSTALLED copy of the
#     unit instead. The empty assignment below is kept only as documentation
#     of the intent; it has no effect.
#   - EnvironmentFile= reset, then /etc/xorgate/agent-rs-dev.env: the parked
#     DEV identity (a73f7a36…, cert bundle under /etc/xorgate/dev-backup-20260823)
#     instead of /etc/xorgate/agent.env (the PROD identity the JS agent owns).
#   - User/Group=pi, like the JS unit's 10-user.conf.
#   - StateDirectory= reset to xorgate-rs + XORGATE_HOME + WorkingDirectory
#     moved to /var/lib/xorgate-rs so the two agents never share
#     settings.json / state.json / agent.pid while both run.
#
# The empty assignments ("Conflicts=", "EnvironmentFile=", "StateDirectory=")
# are systemd's way of clearing a list-valued setting before re-adding to it.

[Unit]
Conflicts=

[Service]
EnvironmentFile=
EnvironmentFile=/etc/xorgate/agent-rs-dev.env
User=pi
Group=pi
StateDirectory=
StateDirectory=xorgate-rs
Environment=XORGATE_HOME=/var/lib/xorgate-rs
WorkingDirectory=/var/lib/xorgate-rs
