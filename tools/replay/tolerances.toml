  [[rule.row]]
  id = "D59"
  what = "D59 (P3a, phase-6/evidence/P3a-takeover.md; review-P3a F2): which recorder sample catches a ONE-sample LED/health state of the BOOT TRANSIENT in a BOOT-STARTED recording session (recording on in settings.json at boot: every handoff restart, every fielded cold boot; manager.start() applies it at once, ts:src/recording/manager.ts:302-331 @09da38d). TS RACE: `await recording.start()` (worker.ts:597) arms the recorder's 1 s interval and the LED heartbeat is armed a few ms later by synchronous code (worker.ts:703, before connect at :734), so the two 1 s timers fire within ms of each other; the recorder reads ledTelemetryNow() only AFTER `await source.sampleGroups()` (worker.ts:544, `ts` also taken after the await), so whether that read lands before or after the heartbeat callback depends on the await, and when the order flips between two samples the TS SKIPS one tick's state (L9: JS live 16 at +1380 and 0 only at +2383, its recorder at +2272 already 0). RUST arms its heartbeat after the MQTT connect + config and command planes (crates/xorgate-agent/src/worker.rs:828), so its recorder samples ~0-90 ms AHEAD of its LED tick and always records the previous tick: Rust holds the blip, JS lacks it, by construction (reordering the Rust heartbeat would reproduce the TS race: not done). The session's first sample is the pre-LED (health_flags 0, led_state starting: ledStarting worker.ts:636 until the first heartbeat :703-708), so the state (gps_no_fix 16, src/lib/led-state.ts:248-249) lands MID-sequence, where the edge-only `fix_edge` arm (led_state_both_held) cannot reach it. Matcher `d59_boot_led_blip` (media_diff.rs d59_boot_led_blips): ONLY metrics.system.health_flags.value / led_state.value; drops ONE-sample blips (v between two samples of one u) at most 5 s after their boot (PlayInfo::boot_wall: the run start or the handoff restart), in a session whose first sample on BOTH sides is within 5 s of its boot, that BOTH sides' live telemetry carried within ±1000 ms, and ONLY where the side LACKING the blip is a JS incarnation; after the drop the two sequences must be EQUAL. UNTOLERATED: a Rust side lacking a blip (Rust-vs-Rust included), a blip > 5 s after the boot, a session that did not start at a boot, a value one side's live telemetry never carried near it, a two-sample state, another leaf, any remaining difference. No number widened (5 s = the diff's startup window, 1 s = the LED heartbeat). Seen in P3a L1.r2, L9, L13, L13b, L14, L16 (2026-11-07): health_flags 16, ~2.07 s after the restart, Rust holding in all six"
  streams = ["rec-telemetry"]
  matcher = "d59_boot_led_blip"
  pinned_by = "D59 (P3a-takeover.md); media_diff::tests::d59_only_boot_transient_one_sample_led_states_both_lives_held"

  [[rule.row]]
  id = "D41"
  what = "D41 (accepted-divergences.md): the /dev/shm reaper, SPLIT BY MECHANISM (review-wp5 R-WP5-2). Matched ONLY JS-vs-Rust on the end-of-run `shm` row, with the Rust count 0, when EVERY JS orphan is one of: (a) REAPER MISS — its owner capture died MID-RUN (gone before the player's SIGTERM: the JS agent alive, `onExit` → `reapShmSegments` ran) AND its name is SPACE-padded (owner pid < 10000). shmsink names areas \"/shmpipe.%5d.%5d\" (gst-plugins-bad sys/shm/shmpipe.c:307 @1.22, getpid()) and the TS reaper matches the prefix `shmpipe.${pid}.` (ts:src/recording/video-capture.ts:873-891, :876 @09da38d), so it can never match a padded name and always matches a 5+ digit one; (b) END OF RUN — its owner capture was still running when the JS agent was told to stop (gone at/after the SIGTERM) AND that JS agent hung past 30 s and was SIGKILLed (the player's `[rig] agent <x> did NOT exit in 30 s` line; js-bug-triage bug 3, the SIGTERM hang): the wedged event loop never runs the reaper at all, so the pid width is irrelevant — any width. Not a widening: the padded-only proxy was simply wrong for (b) (the gate's and WP5's end-of-run JS orphans — media.jsrs09 1222, rec-shed-uv.jsrs09 8785, rec-preset.jsrs09r3 5414: children gone 36–128 ms after the SIGTERM of a JS agent SIGKILLed at +30 s — were padded only because rig pids were still < 10000; rig pids reach 10325 within a 200 s synth tape). UNTOLERATED: a 5+ digit JS orphan from a mid-run death; an orphan of a capture that had ended before the stop and is not (a); a late orphan of a JS agent that exited gracefully; an orphan whose owner was never seen gone; ANY Rust orphan (its own row, even with equal counts); JS-vs-JS and Rust-vs-Rust differences. Rust also reaps its own children's segments at exit (a capture still alive after the shutdown SIGINT is SIGKILLed, waited for ≤ 500 ms and its segments unlinked — no wait for the EOS, the final fragment unchanged); JS does not. That is behaviour, not a tolerance: ANY Rust orphan stays UNTOLERATED under every arm. The Rust agent's start-up sweep (dead owners only) assumes a shared pid namespace and /dev/shm (bench, rig) — Phase 7 containers must revisit it. Orchestrator 2026-11-06 (WP5 items 8–9, review R-WP5-2)"
  streams = ["shm"]
  matcher = "d41_js_shm_orphans"
  pinned_by = "D41 (accepted-divergences.md); media_diff::tests::shm_orphans_count_padded_names_and_a_strand_fails (both arms + negatives); xorgate-core capture_ladder::tests::shm_owner_pid_reads_shmsinks_padded_names; xorgate-hal shm_reaper::tests::reaps_a_padded_four_digit_pid + startup_sweep_removes_only_dead_owners_segments; xorgate-agent tests/capture_supervisor.rs (real names) + tests/recording_manager.rs start_sweeps_dead_shm_segments_once_before_recovery"

  [[rule.row]]
  id = "D40"
  what = "D40 (accepted-divergences.md): the clock stepper's hold-off expiry tick. The TS sets holdUntilMono after the implausible tick's two awaits and compares at each check tick after its probe await, so whether the 10th tick is past the 5 min hold-off is a latency race; Rust steps at the first check tick with mono ≥ its holdUntilMono, the JS (slow cold first exec) one check interval later, so the trust events differ: JS fallback warn + `<src> synchronized <T> s after boot — clock trusted (published <P> s on an untrusted clock)` (|T − G − P| ≤ 1, see below) vs Rust `<src> synchronized — clock trusted (telemetry held <G> s, <N> sample(s))`. Matcher `d40_holdoff_expiry_tick` (diff.rs `d40_keys`): ONLY JS-vs-Rust, both sides rejected an implausible source in their first check tick, Rust steps 300–330 s after its own implausible event and JS 29–31 s later than Rust (each relative to its own), identical `stepped system clock` text, and exactly that trust-event pair with the same src, G and N — then ONLY those three event keys; anything else is UNTOLERATED Review-wp4 R4-5: p4-clock-cap now delivers the implausible NITZ from 15 s (check tick 1), so both steps fall AFTER the 300 s grace: both sides fall back with the SAME warning (same G, N), and only the trust texts differ (`<src> synchronized <T> s after boot — clock trusted (published <P> s …)`, T one check interval apart, |T − G − P| ≤ 1 on each side). The matcher accepts that tick-1 shape with the same strictness (Rust 300–330 s after its implausible event, JS 29–31 s after Rust, identical step texts, exactly one fallback each) and keeps the tick-0 shape unchanged; pinned by the same test + clock_stepper.rs::d40_hold_off_is_taken_after_the_modem_read (the await order). AMENDED 2026-10-27 (orchestrator ruling item 4): the two step texts may differ ONLY by 0.1 in the displayed offset (the same float formula on both sides, toFixed(1) at two fixes 30 s apart: ts:src/agent/clock-step.ts:252,266,279 ↔ crates/xorgate-core/src/clock_step.rs:349,368,435; diff.rs d40_same_step); 0.2, another shape, source or count FAILS. In the tick-1 arm the grace warnings may differ as T8/grace-fallback-phase allows, with |T − G − P| ≤ 1 per side on its OWN G NOT EXERCISED by the final replay runs (review-wp4 R5 note): on the tick-1 tape with the 250 ms probe both sides stepped on the same tick in all 6 final p4-clock-cap JS-vs-Rust runs (stepC .c2.jsrs1-3, .r27.jsrs1-3); the race fired only in stepC p4-clock-cap.clk.jsrs (the superseded 500 ms-probe tape: Rust 331 s / JS 361 s, step texts +597.9 / +598.0, all accepted by this arm under the final rule). It cannot be forced: whether a side steps at tick 11 or 12 depends on its own timer drift over ten ticks against the tick-1 awaits (tens of ms either way, per run), so a tape that made it fire every run would be a knife edge again. The Rust pins (clock_stepper.rs d40_steps_at_the_first_tick_past_the_hold_off, d40_hold_off_is_taken_after_the_modem_read) carry it. CORRECTED 2026-11-10 (F-P2-ROUND, review-P2 finding 3; this only removes false FAILs): 'T − G = P' is not an identity. T, G and P are each toFixed(0) of their OWN raw ms (ts:src/agent/clock-trust.ts:104-106 @09da38d): T = secs(now − start) and P = secs(now − start − heldMs) (:121), G = secs(elapsed) with heldMs = that same elapsed (:129, :132, :135); so raw T = raw G + raw P (+ ≤ 1 ms between the two monoMs() reads of :121), and each rounding error lies in [−0.5, +0.5), so P ∈ {T − G − 1, T − G, T − G + 1}. Rust prints the same three values (crates/xorgate-core/src/clock_trust.rs:120-122 trust_secs = js::to_fixed(ms/1000, 0), :134-143 late_trusted_event, :198-218 establish, :222-236 check_grace). Counter-example: P2 p4-clock-cap.jsrs.a, Rust T 331, G 300, P 30. Both arms now require |T − G − P| ≤ 1 on each side against that side's OWN G (diff.rs trust_tgp_ok); a gap of 2 still FAILS (diff::tests::d40_holdoff_expiry_tick_only_the_documented_race)"
  streams = ["events"]
  matcher = "d40_holdoff_expiry_tick"
  pinned_by = "D40 (accepted-divergences.md); diff::tests::d40_holdoff_expiry_tick_only_the_documented_race; crates/xorgate-agent/tests/clock_stepper.rs::d40_steps_at_the_first_tick_past_the_hold_off"

[[rule]]
id = "T8"
title = "Phase 2 orchestrator decisions"
basis = "phase file T8; O2, O3, O4; WP1 brief (publish while disconnected); README §6 (build identity)"
kind = "decisions"

  [[rule.row]]
  id = "O2"
  what = "O2 mono-vs-wall intervals — the five the TS measures on Date.now(): the gps reopen watchdog (30 s), NMEA freshness (10 s), TTFF, the gnss-sky.json 15 s cadence, the refresh 30 s window — PLUS WP2's lte/system `sample()` 1 s cache gates (collectors/lte.ts, system.ts:94-114), all on mono in Rust. Values are identical unless the wall clock steps: tolerated only within a window around a tape `clock` event that shows a wall step"
  matcher = "wall_step_window"
  # NARROWED (review-wp7): only the six mono-derived observables.
  # NARROWED (re-review R7): of the acks only the refresh 30 s window's
  # decision — `status`/`reason` of a `refresh` ack that is `rate-limited` on
  # at least one side.
  observables = [
    "telemetry:metrics.gps", "telemetry:metrics.gps.**",
    "file:gnss-sky.json:timestamp", "file:gnss-sky.json:hold_s",
    "ack:status", "ack:reason",
    "telemetry:metrics.lte", "telemetry:metrics.lte.**",
    "telemetry:metrics.system", "telemetry:metrics.system.**",
  ]

  [[rule.row]]
  id = "sim-mode-telemetry"
  what = "O7 (orchestrator 2026-10-10, wp7-fix-cov sms-sim scenario): with MODE=sim on the tape (meta.env.MODE) each agent's telemetry is its own simulator — the TS generator vs the Rust empty SimSource (O7: sim runs with collectors off) — so the telemetry stream is NOT compared for that tape (diff.md says so; telemetry compared = 0). Every other stream (sms, acks, reports, status, events, files) is compared as usual"
  streams = ["telemetry"]
  matcher = "sim_mode"

  [[rule.row]]
  id = "O3"
  what = "`update` sudo argv names xorgate-updater-rs.service"
  streams = ["sudo"]
  normalize = { "xorgate-updater-rs.service" = "xorgate-updater.service" }

  [[rule.row]]
  id = "sms-duration"
  what = "read_sms `durationMs` is a measured wall span of the sweep (TS sms-modem.ts:504-519 `end - start`; Rust command_flow.rs, monotonic, series-5 item 2): two agents' sweeps take 0-2 ms each (JS-vs-JS spread over every series-1..4 run: max 2 ms of 18 pairs). Matched ONLY on `…/sms` `durationMs` and the `durationMs=<n>` of the `read_sms <id>:` / (Phase 5b, WP4 — reviewer to confirm) `clear_sms <id>:` event line (paired per request id; the clear line is the same template `${cmd.command} ${requestId}: … durationMs=${payload.durationMs}` and the same `end - start` span, ts:src/worker.ts:1055-1059 + ts:src/hardware/sms-modem.ts:690-702 @09da38d; p5b-sms-clear JS-vs-JS: |Δ| ≤ 10 ms over 6 clears, incl. an 8.1 s slow clear and a 25.2 s delete timeout), ONLY when BOTH values are non-negative integers differing by at most max_delta_ms; nothing else in the payload"
  streams = ["sms", "events"]
  matcher = "sms_duration_ms"
  max_delta_ms = 50

  [[rule.row]]
  id = "pidfile"
  what = "pidfile worker / argv / nodeVersion (CF4)"
  streams = ["pidfile"]
  paths = ["worker", "argv", "argv.**", "nodeVersion"]

  [[rule.row]]
  id = "writtenBy"
  what = "state.json writtenBy"
  streams = ["state"]
  paths = ["writtenBy"]

  [[rule.row]]
  id = "build"
  what = "the agent's own build identity in the report (README §6, Q7: each agent reports its own build)"
  streams = ["report"]
  # NARROWED (review-wp7): the key set and order of `build` are compared; only
  # the four leaf VALUES are each agent's own.
  paths = ["effective.agent.build.version", "effective.agent.build.channel", "effective.agent.build.builtAt", "effective.agent.build.packageVersion"]
  values_only = true

  [[rule.row]]
  id = "D85"
  what = "D85 (phase-1/evidence/accepted-divergences.md; Phase 8 D9, Q-8.3 ACCEPTED by the user): the Rust agent's report marker `effective.agent.runtime: \"rust\"`, appended as the LAST key of the agent block (config_report.rs AGENT_RUNTIME); the JS @09da38d sends no such key. PRESENCE-ONLY (review-wp-r2 SHOULD-1; `rust_only_value`, diff.rs cmp): tolerated ONLY on a JS-vs-Rust pair where the JS side lacks the path and the Rust side holds exactly \"rust\". A changed value, a Rust side without the marker, any Rust-vs-Rust or JS-vs-JS difference stays UNTOLERATED. Only this path is covered; the agent block's other keys, their order (the key-order check compares only shared keys) and every value stay compared"
  streams = ["report"]
  paths = ["effective.agent.runtime"]
  rust_only_value = "rust"
  pinned_by = "D85 (accepted-divergences.md); config_report::tests::d85_effective_agent_reports_runtime_rust_last; tests/config_report_fixtures.rs strip_d85 (12 JS-golden agent blocks); diff::tests::should_narrowings_host_sign_build_o2_end_snapshot (presence-only arms)"

  [[rule.row]]
  id = "D107"
  what = "D107 (phase-1/evidence/accepted-divergences.md; plan support-other-camera-models Phase 2): the Rust agent advertises one capability the JS agent does not have, `camera.sensors`, as the LAST item of `effective.agent.capabilities` (config_report.rs AGENT_CAPABILITIES, CAPABILITY_CAMERA_SENSORS). ONE EXTRA LAST ITEM (`rust_only_last_item`, diff.rs cmp): tolerated ONLY on a JS-vs-Rust pair where the Rust side's array is the JS side's array with exactly \"camera.sensors\" appended. Another item, another position, a changed shared item, the item on the JS side, and any Rust-vs-Rust or JS-vs-JS difference stay UNTOLERATED"
  streams = ["report"]
  paths = ["effective.agent.capabilities"]
  rust_only_last_item = "camera.sensors"
  pinned_by = "D107 (accepted-divergences.md); config_report::tests::the_capability_list_is_one_constant_in_every_agent_block; tests/config_report_fixtures.rs strip_d85; diff::tests::should_narrowings_host_sign_build_o2_end_snapshot (the D107 arms)"

  [[rule.row]]
  id = "cli-banner"
  what = "build identity + usage (README §6, Q7; WP6 A5; review-wp6 item 2 — NOT D20, which is the build-info fallback channel): `-v` prints `xorgate-rs <build>` vs `xorgate <ver>` (version.rs:1-15 vs cli.tsx:24-26,64-67); `help` / no verb / an unknown verb print the Rust usage (cli.rs usage(): this binary's verbs, the systemd hint for start/stop/restart, `manage` without daemon control — Q10/D35) vs cli.tsx's. C11: stdout differs; exit code and stderr must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-systemd-verbs"
  what = "`start` / `stop` / `restart` (WP6 A5; README §3.3 drops the self-managed daemon): Rust prints `xorgate-rs: '<verb>' is systemd's job for the Rust agent: sudo systemctl <verb> xorgate-agent-rs` and exits 1 (cli.rs) where the TS manages its detached worker (manager.ts start/stop/restart). C11: stdout/stderr/exit differ; settings.json must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-q9-names"
  what = "MAPPING row (cli-matrix.sh `map:`), not a free pass: Q9 local-only CLI hints name the Rust binary — `[xorgate-rs] update failed: … sudo xorgate-rs update` (D-WP4-6), the `xorgate-rs led` usage block + `'xorgate-rs led off'` (WP1 Q9 strings), `xorgate-rs sms` help (D34). The Rust side's `xorgate-rs` → `xorgate`, then stdout/stderr/exit/settings.json must be identical"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-sms-duration"
  what = "MAPPING row: `xorgate-rs sms` prints the sweep's own duration (`· <N> ms`), a timing — normalised on both sides, everything else identical (the T8/sms-duration rule of the …/sms payload, for the CLI)"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-tui-no-tty"
  what = "`manage` / `monitor` without a terminal (the matrix runs with stdin </dev/null): ink renders its first frame then fails `Raw mode is not supported…` (exit 1) where crossterm fails `No such device or address (os error 6)` (exit 1) before drawing. The TUI itself is compared on ratatui TestBackend frames vs the TS monitor.test.tsx its (D35, tests/manage_tui.rs) and on the bench over `ssh -t` (E15); exit code and settings.json must match"
  streams = ["cli"]

  [[rule.row]]
  id = "logs-journal"
  what = "O9: with no $XORGATE_HOME/agent.log the Rust `logs` execs `journalctl -u xorgate-agent-rs -n N` (logs.rs:59-72) where the TS prints the empty-log text (logs.ts). C11: stdout/stderr/exit differ when the home has no agent.log; with an agent.log both must match"
  streams = ["cli"]

  [[rule.row]]
  id = "set-mode-running"
  what = "WP6 A3: `set mode <m>` while an agent is running — the TS restarts its self-managed daemon (set.ts:515-530: stop + start with the pidfile argv), Rust (systemd only, README §3.3) prints `could not restart automatically: …` + the `sudo systemctl restart xorgate-agent-rs` hint and exits 1 (cli_set.rs:54-63), the shape of the TS failure branch :527-529. C11: stdout/stderr/exit differ; settings.json must be identical"
  streams = ["cli"]

  [[rule.row]]
  id = "rig-cut-ungated"
  what = "RIG limitation, NARROWED per review-wp7 finding 4: while the broker path is cut the hold gate cannot observe ticks (publishes are queued), so inputs are released ungated and the fallback pairing keeps the pre-cut offset. Inside a closed span (extended until BOTH agents publish again) ±5 s the diff therefore RE-PAIRS the telemetry with the alignment (current partner, or one tick earlier/later) chosen by TIMING, never by content (re-review R4): the fewest input bursts released between the two reads (releases.ndjson), then the nearest ts — then compares STRICTLY: no presence tolerance, no gps/lte/system value tolerance. The only residual: a VALUE inside the span whose group's input the tape released BETWEEN the two agents' reads (the gate cannot hold releases while an agent's ticks are unobserved — still the case until BOTH reconnect): metrics.imu.* ← an IMU line (−1 s), metrics.lte.* ← an LTE-file change, metrics.system.* ← an exec/dt change, and for lte/system ONLY a field that change moved, as an old/new split on BOTH sides in one direction (re-review R4: A_k = B_k−1 and B_k = A_k+1, or the mirror; a field equal in both versions, or frozen on one side, never matches); never gps (continuous NMEA, aligned by the re-pair). A re-pair run may orphan at most 2 ticks (judged as this row; listed with the moves in diff.md); otherwise ONE unpaired tick per side and span is reconnect-cadence. Replaces the earlier `cadence` row: publishing while disconnected is now parity (WP1 follow-up; Phase 0 deviation #8 gone)"
  streams = ["telemetry", "status"]
  around_closed_ms = 5000

  [[rule.row]]
  id = "offline-queue-bound"
  what = "offline queue bound (WP1 follow-up amb. 1): Rust caps the QoS 1 store and the QoS 0 queue at 1000 each, oldest dropped (xorgate-cloud mqtt.rs OFFLINE_QUEUE_LIMIT); mqtt.js is unbounded (client.js:1081-1096). Past ~16.7 min of outage at 1 Hz the TS flushes more stale telemetry and counts more `published`; a Rust seq jump across such a span is the dropped ticks. Shorter outages: parity (every tick flushed)"
  streams = ["telemetry", "state"]
  around_closed_ms = 5000
  min_span_ms = 1000000

  [[rule.row]]
  id = "report-echo"
  what = "Phase 5b (WP4; NEW ROW — reviewer sign-off required, rule 7; orchestrator ruling 2026-10-23, the ONE narrow rule): a config-report `(count)` difference in a quiet period made ONLY of ECHOES — a report whose payload is byte-identical to the same side's previous report once the publish stamps (`ts`, every `status.<ns>.at`) are removed, published DEBOUNCE (2000 ms) ± 150 ms after it (Δ − 2000 = the spread of where inside a publish tick `obdReportDue` runs, tick k+2 vs tick k: budgeted at the rig's same-instant window, T12's 150 ms; observed −51…+94 ms over 12 JS and 4 Rust sides). After removing each side's echoes the counts must be equal; a changed payload, an echo outside the window, or any extra non-echo report stays UNTOLERATED. The rest of the period is compared as before (its last report on each side) REBUILT after review-wp4 R4-1: an echo counts ONLY when it carries `effective.obd` AND that side's telemetry moved `metrics.obd.link` on the publish tick one debounce (±150 ms) before it (the `obdReportDue` trigger), at most one echo per move; with the echoes removed the reports are compared PAIRWISE (not only the last). A side publishing every report twice, or a corrupted report in an echo period, FAILS (tests M-E1, M-E2)."
  basis = "ts:src/worker.ts:1399-1404 (`obdReportDue` → `requestConfigReport` on the publish tick, on an OBD link move) + ts:src/agent/config-sync.ts:1604-1617 (`request`: ONE 2 s debounce timer, coalescing only while armed) @09da38d: the timer armed on tick k fires at tick k+2's instant, and the emulator's ~2 s probe moves the link 0→1→2 across exactly those ticks, so whether the second move coalesces or re-arms (an echo) is the order of two callbacks due at one instant. The JS alone shows it: both JS sides of every JS-vs-JS run — stepB/p5b-obd-config.cal09, stepC-H9/p5b-obd-config.cal09a/b (3 echoes per side, 1983–2094 ms), the JS side of every stepC p5b-obd-config run (2–3), one fewer on the JS of .jsrs2. Pinned by diff::tests::report_echo_only_an_identical_report_one_debounce_later"
  streams = ["report"]

  [[rule.row]]
  id = "grace-fallback-phase"
  what = "Phase 5b (WP4; NEW ROW — orchestrator ruling 2026-10-27, item 1): the 300 s clock-trust grace warning `[clock] no NTP/GPS/NITZ sync <G> s after start — publishing on an UNTRUSTED clock (<N> sample(s) held); …`. It fires at the first trust check at/past 300 s of the gate's own monotonic start, either a telemetry tick (`trusted()` → `checkGrace`) or the 5 s probe poll; G = toFixed(0) of that elapsed, N = the held ticks so far. N is DERIVED per side: it must equal the `seq` of that side's own first published sample (the held ticks still advance seq), and that sample must be the side's first tick at/after its warning (< 1.1 s). Cross-side the two warnings must be < 1 s apart (one tick, each agent on its own phase); then |N_A − N_B| ≤ 1, and the side that fell back one tick earlier may leave exactly ONE telemetry message unpaired: its own first published sample (seq N), whose counterpart the other side still held. G cannot be derived: the gate's start instant is not taped. So G alone gets ±1, on this one text only. Anything else FAILS: G 2 s apart, N 2 apart, an N that is not the side's own first seq, warnings ≥ 1 s apart, or any other text difference"
  basis = "ts:src/agent/clock-trust.ts:104-106 (`secs` = toFixed(0)), :127-137 (checkGrace: elapsed = monoMs() − startedMono), :147-152 (5 s poll), :173-175 (`trusted()` calls checkGrace) + ts:src/worker.ts:1409-1411 (held tick: noteHeld, seq advanced, no publish) @09da38d ↔ crates/xorgate-core/src/clock_trust.rs:148. JS@09 alone, run to run: G 300 (stepC p5b-clock-fallback.c2.jsrs, p4-clock-cap.c2.jsrs) and 301 (p5b-clock-fallback.clk.jsrs2, p4-clock-cap.clk.jsrs); N 297 (p5b-clock-fallback.c2.jsrs2), 298, 299 (p5b-clock-fallback.fin.jsrs). JS@09 vs Rust: p4-clock-cap.c2.jsrs3 G 300/301 N 298/298; p5b-clock-fallback.c2.jsrs2 G 300/301 N 297/298, warnings 483 ms apart, A's first sample (seq 297) unpaired"
  streams = ["events", "telemetry"]
  matcher = "grace_fallback_phase"
  pinned_by = "diff::tests::grace_fallback_phase_only_one_tick_and_one_second"

  [[rule.row]]
  id = "obd-audit-cycle"
  what = "Phase 5b (WP4; NEW ROW — reviewer sign-off required, rule 7; CF81): the OBD helper's `effective.obd.audit` counters are cumulative request counts of its 1 Hz poll loop, snapshot at an audit line (every 60 s from the helper's start and at every stop/restart); a restart lands on the cloud config message while each side's helper is inside its own poll cycle, so one side may hold a few more requests of that ONE cycle. Matched ONLY when, in one direction, every `inventory` count is equal or exactly one higher, `requests` and `ok` are higher by exactly the number of those steps, `bytes_tx` by 1..=8 bytes per extra request, and every other counter and audit key is EQUAL; else UNTOLERATED ARM (review-wp4 R6-1, orchestrator ruling 2026-10-28): in the LAST audit of a helper the agent signalled to stop (the relay log: its pid's last `audit-line` + `helper-exit` signalled), ONE request cut in flight — that side's `requests − ok` exactly 1, every other counter unmoved, the cycle arithmetic holding with `ok` short by it (the helper counts requests / bytes_tx / inventory BEFORE the write and read, python/obd/gate.py:131-136, and `ok` only after a reply, :187; the stop signal raises Shutdown out of the read, session.py:90 @09da38d; seen on both agents: stepC p5b-obd-config.r27.rsjs3 JS side, r28.jsrs4 Rust side). Every other audit keeps exact equality; 2 unanswered, a moved timeout, or the shape in a non-stop audit FAIL (diff::tests::audit_cycle_one_in_flight_request_only_in_a_stop_audit) Two consequences of that same cut, cited under this row and nowhere else: (1) the cut helper's close ATZ reads the in-flight reply as its own, so the REAL ATZ reply is left on the line and the side's next helper start drains it (14 B `ELM327 v1.5\r\r>`, stepC p5b-obd-config.r31.jsrs2 Rust side after its 383/382 stop audit) — such a stale drain — exactly ONE ATZ reply, 14 B; any other size still counts (review-wp4 R7 NIT) — is excluded from the cross-side stale-drain count; (2) the cut close skips the emulator's ATZ reset sleep (`reset(0.5)`, ELM327-emulator obd_message.py:547), so at that helper's final `stopped` status of a MID-RUN stop — when only THAT side's helper was cut — the cut side must be the WAITER, 300–900 ms (400 + the full 500 ms reset; ≥ 300 = the smallest early stop seen, 454 ms, less the 150 ms same-instant slack; review-wp4 R7 SHOULD-FIX; r31.jsrs2 454 ms, r32.jsrs1 462 ms); outside that window it FAILS; any other edge, a clean stop, both sides cut, or the run's FINAL stop (the agents' own shutdown, where no side waits out the reset: every cut final stop seen waited 0–7 ms, stepC p5b-obd-config.r32.jsrs1 / r33.jsrs1 edge 35, p5b-obd-audit / p5b-obd-emulator .r33.jsrs1 edge 8) keeps the 400 ms bound (diff_p4::tests::obd_gate_waits_over_the_bound_or_timeouts_fail)"
  basis = "python/obd/session.py:173-228 @09da38d (emit_audit every AUDIT_EVERY_S = 60 s from the helper's own start, and on stop/restart), the restart on every cloud config message ts:src/worker.ts:981-985 (`source.obdReapply()`) → ts:src/agent/collectors/obd.ts settings re-read + helper restart. Seen JS-vs-JS @09da38d on p5b-obd-config (stepB/p5b-obd-config.cal09): requests/ok +3 with 3 inventory keys +1 and bytes_tx +18; +2/+2/+12. Pinned by diff::tests::audit_cycle_delta_only_a_one_cycle_split"
  streams = ["report"]

  [[rule.row]]
  id = "obd-sample-split"
  what = "Phase 5b (WP4; NEW ROW — reviewer sign-off required, rule 7; CF81): a `metrics.obd.*` value is the side's own helper's latest sample (its 1 Hz poll cycle runs from ITS start, one emulator per side), read by the agent's own 1 s tick: a value that changes for one helper cycle (the taos-2022-crank voltage dip) can reach the two agents one sample apart. Matched ONLY on `metrics.obd.*.value`, ONLY as a strict one-sample old/new split on BOTH halves (A_k = B_k−1 and B_k = A_k+1, or the mirror); a value one side never carried at k±1, or a lag of two samples, is UNTOLERATED NOT `metrics.obd.link` (review-wp4 R4-2: `link` is `currentLink()` from the helper's status lines, ts:src/agent/collectors/obd.ts:640-659, compared exactly). CAPPED per leaf per run (R4-9): more than ONE split of one leaf → every split of it UNTOLERATED (a systematic lag, or a shifted pulse): since the obd-gate relay aligns the two helpers' edges and poll phases the row fired 0 times in all 18 relay-era runs; counts + direction in diff.md."
  basis = "python/obd/session.py poll loop (1 Hz per helper, own start) + ts:src/agent/collectors/obd.ts `sample()`/`read()` → `mapLatest()` (the latest helper `sample` line) @09da38d. Seen JS-vs-JS @09da38d on p5b-obd-crank (stepB/p5b-obd-crank.cal09r2): module_voltage 12.1 vs 9.82 one sample apart. Pinned by diff::tests::obd_sample_split_only_a_one_sample_split"
  streams = ["telemetry"]

  [[rule.row]]
  id = "led-tick-lag"
  what = "Phase 5b (WP4; NEW ROW — reviewer sign-off required, rule 7): `metrics.system.led_state` / `health_flags` (X1) are resolved on each agent's OWN 1 s LED heartbeat, not on the publish tick that carries them, from inputs the LED manager caches on that heartbeat; so around a change of a ladder input (a shed rung, the LTE status, the cloud link, a GPS fix) the two payloads may carry the old and the new state one sample apart. Matched ONLY on those two leaves, ONLY as a strict one-sample old/new split on BOTH halves (A_k = B_k−1 and B_k = A_k+1, or the mirror). A value the other side never carried at k±1, or a lag of two samples or more, is UNTOLERATED; every other leaf of the payload (recording.powerShed / liveBlock included) is compared as before The matcher checks the one-sample split shape only, not the input change behind it (review-wp4 R4-N3). CAPPED per leaf per run (R4-9): more than max(2, ⌈changes/2⌉) splits of one leaf → every split of it UNTOLERATED (a change splits only when it lands between the two agents' heartbeat phases, ≤ 500 ms of 1 s after pairing → ≤ half of the changes; calibration p5b-led .cal09: 3 of 13); counts + direction in diff.md. Rust pin that the LED telemetry is the current heartbeat's resolve: crates/xorgate-agent/tests/led_manager.rs::every_led_manager_it_matches_the_ts_trace (its `tel(led)` reads the telemetry each tick resolved; WP3)."
  basis = "ts:src/worker.ts:703-705 (`heartbeat` setInterval → `led.tick()`) vs the publish setInterval ts:src/worker.ts:1357 carrying `ledTelemetryNow()` (ts:src/worker.ts:375-381, :1380) — two timers per agent, each on its own phase; inputs cached on the heartbeat: recordingStatusForLed ≤ 2 s (ts:src/worker.ts:653-659), the LTE status re-read ≤ 1 s and async (ts:src/agent/led-manager.ts:27,195) @09da38d. Seen JS-vs-JS @09da38d on p5b-led (phase-5b/evidence/stepB/p5b-led.cal09): 3 single-sample splits (shed start 96.8 s, shed restore 171.2 s, dead_zone end 202.3 s) while recording.* agreed in the same pairs; pinned by diff::tests::led_tick_lag_*"
  streams = ["telemetry"]

  [[rule.row]]
  id = "input-edge"
  what = "NARROWED per review-wp7 (JS-lag only): within ±1.5 s of an NMEA transition (gps group: stream start/stop/stale/resume, GGA quality change) or a GSV satellites-in-view change, a metrics.gps.* value where the JS agent reads Rust's PREVIOUS sample and the JS NEXT sample equals Rust's value — the line reached Node's read a tick later; a Rust value one tick late is NOT covered; at most 2 ticks per 10 min. Cause: the TS handles NMEA per CHUNK on the event loop (hardware/gps.ts:61-74, fs.ReadStream through the libuv threadpool) and lagged a released line by 0.15–0.4 s in the loaded VM, where Rust's reader thread forwards it at once. Seen 1–2× per 10 min JS-vs-Rust (fix_quality on a 13 ms pair after an NMEA restart; sky_state, whose change is a hold timer measured from GSV ARRIVAL, sky_state.rs / gps.ts), never JS-vs-JS. A value that matches neither neighbour stays UNTOLERATED"
  streams = ["telemetry"]
  around_closed_ms = 1500
  # NARROWED (review-wp7): JS-LAG only — the JS value is Rust's PREVIOUS sample
  # and the JS NEXT sample is Rust's value (a Rust value one tick late fails);
  # only metrics.gps.* within ±1.5 s of an NMEA transition (gps group) or a GSV
  # satellites-in-view change; at most 2 ticks per 10 min, else all UNTOLERATED.
  max_hits_per_10min = 2

  [[rule.row]]
  id = "ttff-arrival"
  what = "NARROWED to ±0.1 s (review-wp7). `ttff_s` is the difference of two NMEA line ARRIVAL instants inside each process (first quality-0 GGA → first fix, gps.ts:139-151 / gps_group.rs TtffClock, identical logic). The player writes each line to both ptys at once, but Node handles a pty chunk when its event loop gets to it (fs.ReadStream reads through the libuv threadpool; 0.4–1.5 s tick stalls were seen in the loaded Docker VM) while Rust's reader thread forwards it at once; quantised to 0.1 s (round(t,1)) this flips by one step (149.1 vs 149, JS-vs-Rust; JS-vs-JS identical). Tolerated: ±0.1 s (one quantum) on `metrics.gps.ttff_s.value` only"
  streams = ["telemetry"]
  # NARROWED (review-wp7): one 0.1 s quantum.
  numeric = { "metrics.gps.ttff_s.value" = 0.1 }

  [[rule.row]]
  id = "sky-file-end"
  what = "RIG: gnss-sky.json at the end is each agent's LAST 15 s write (gps.ts:232-258 SKY_PUBLISH_MS) at its own instant (`timestamp`); `hold_s` is the state's age at that write, so with the SAME `state` it may differ by the distance between the two writes' `timestamp`s (rounded up) + 1 s truncation; every other key of the file is compared"
  streams = ["file:gnss-sky.json"]

  [[rule.row]]
  id = "d30-js-reference"
  what = "CALIBRATION ONLY (JS-vs-JS): D30 inside the reference — a JS shed tick deciding on its recorder's ≤ 1 s old cached power reading (TS system.ts:104-113 + Node setInterval re-arm), so one JS logs the previous rail value and its restore lands one shed tick later. Matchers (media_diff.rs, HARD GUARD in code: both return false unless BOTH sides are js; nothing here can widen them): `d30_js_shed_text` — exactly one A+1 and one B+1 `power shed → …(rail <V>V < …)` message, identical with V masked, the two V consecutive distinct values of the tape's released pmic series, the stale side's event in [release of the fresher value, +1100 ms], one pair per masked template; `d30_js_spawn_tick` — kvs `(spawn ms after start)` only, 1000 < |Δ| ≤ 1150, each side's spawn lagging its own last powerShed/liveBlock change by the same ±300 ms, every kvs spawn of that restore shifted by the same Δ ±150, at most channels × shed changes rows. JS-vs-Rust / Rust-vs-JS / Rust-vs-Rust: the same rows stay UNTOLERATED (Rust is never stale). Orchestrator 2026-10-19 (replay-20261019T173537Z)"
  streams = ["events", "children"]
  matcher = "d30_js_shed_text"
  pinned_by = "D30 (accepted-divergences.md); review-wp6 re-check; media_diff::tests::d30_js_reference_only_for_js_vs_js"

  [[rule.row]]
  id = "d30-js-late-shed"
  what = "D30 (accepted-divergences.md) as seen JS-vs-Rust, orchestrator option (b) 2026-10-19: at a power crossing the JS shed tick may REUSE its recorder's ≤ 1 s old reading (TS system.ts:104-113, Node setInterval re-arm), so ONE shed/restore transition lands one shed period LATER on the JS side; Rust never reuses (collectors/system.rs:61-79). Matcher `d30_js_late_shed` (media_diff.rs; HARD GUARD in code: JS-vs-Rust with the JS side later, or JS-vs-JS with either side later — the later side must be JS and carry the evidence itself; review-wp6 re-check extension 2026-10-19): per transition Δ = JS − Rust ∈ [850, 1150] ms AND evidence of stale reuse from the tape's released vcgencmd values + the JS recorder's own samples (a release before the decisive tick that its previous sample lacked and its next carried), or the next transition of the same chain shifted by the same Δ ±150; then ONLY that transition's downstream rows — kvs/capture spawn instants within 6 s after it, sidecar durationMs of the session it started (JS shorter by Δ) or of a fragment ending at it (JS longer by Δ; or, for the fragment it CUT — the last seq of its session on BOTH sides — its END instant startTs+durationMs later by Δ, the duration being free because the fragment start is the capture's keyframe cadence and a shed right after a keyframe leaves a 0–2 ms last fragment on the TS too: every rec-shed-uv JS-vs-JS run; orchestrator 2026-10-23, Phase 5b WP4, pinned by media_diff::tests::d30_js_late_shed_cut_fragment_by_its_end_instant_only), and the startTs/startMono of the fragment that STARTS at it (orchestrator 2026-10-19) — by the same Δ ±150; one shift per transition. Rust-later, |Δ| outside the band, missing evidence on the later side, and rust/rust: UNTOLERATED. (powerShed string instants are T4 transition, liveBlock.since T1)"
  streams = ["children", "sidecar"]
  matcher = "d30_js_late_shed"
  pinned_by = "D30 (accepted-divergences.md); media_diff::tests::d30_js_late_shed_only_js_later_with_evidence"

  [[rule.row]]
  id = "end-snapshot"
  what = "RIG: state.json `latest` at the end — both agents get SIGTERM together, but their last ticks before it are up to one tick apart (different phases), so the final payload's values may be one sample apart; `seq` there is T2, `ts` T1. Every published payload is compared in the telemetry stream"
  streams = ["state"]
  # NARROWED (review-wp7): no path exclusion. Each side's `latest` must EQUAL its
  # own last published telemetry payload (else UNTOLERATED); across agents the
  # key structure of `latest` is compared under the telemetry rules (T4/T6 …)
  # and only the VALUES are this row.
  matcher = "end_snapshot"
  # Phase 3: state.json's `recording` block is written at SHUTDOWN, racing the
  # last fragments' EOS + finalize (JS-vs-JS 1 vs 3). NARROWED (review-wp6
  # FLAG 3): NO cross-side bound — media_diff.rs checks each side's value
  # against [its own last tick − 1, the unuploaded pieces on its disk] and
  # only then cites this row for `recording.backlogSegments` (any Δ). Every
  # tick's `recording.backlogSegments` is still compared EXACTLY in telemetry.

  [[rule.row]]
  id = "mqtt-error-text"
  what = "MQTT/TLS transport error TEXT (wp1.md amb. #6; review-wp1 MUST-FIX #1 item 1; WP1 follow-up amb. 5): the state.json `error` events and `lastError` carry rumqttc/rustls text where mqtt.js/Node has its own (`read ECONNRESET`, `Client network socket disconnected …`), EXCEPT `Keepalive timeout` and `connack timeout`, which WP1 maps to the mqtt.js words and which must match exactly. Other error-level events that are not one of the agent's own wordings compare as one class `<transport error>` (present on both sides or neither); `lastError` likewise"
  streams = ["events", "state"]
  matcher = "transport_error_event"
  own_prefixes = ["publish error:", "config subscribe failed", "command subscribe failed", "unhandledRejection", "ledger write failed", "read error:", "upload failed"]
  exact_texts = ["Keepalive timeout", "connack timeout"]

  [[rule.row]]
  id = "reconnect-cadence"
  what = "reconnect phase (review-wp1 MUST-FIX #1 item 2; WP1 follow-up amb. 3, 5; rewritten by fix-timer-cadence): both agents retry a FIXED 2000 ms after every close, no growth, no jitter (mqtt.js 5.15.1 `_setupReconnect` with `reconnectPeriod: 2000`, mqtt.ts:63 ↔ xorgate-cloud backoff.rs `BackoffConfig::fixed` 2000 ms, mqtt.rs `pause_before_reconnect`), but each on its OWN phase (counted from its own close), so after a restore one can reconnect up to ~2 s before the other; and a black-holed link is detected at rumqttc's 2nd unanswered ping (~2× keepalive) vs mqtt.js ~1.5× (the rig's proxy closes the sockets, so not reached there). So in a run with a closed span: the COUNTS of `reconnecting…` / `connection closed` differ by at most ONE per closed span, EITHER way; the transport-error class count differs; a telemetry/status message inside the span (extended to both reconnects) ±5 s may be unpaired (a QoS 0 tick racing the drop is lost by Rust, written to the dying socket by mqtt.js); `published`/`publishErrors` may differ by 1 per closed span + 1 (the SIGTERM race at the end); the REPORT count of a quiet period overlapping the span may differ (each reconnect's retained redelivery triggers a `cloud` report, and the agent reconnecting first can see an intermediate retained rev the other never sees — the next quiet period's last report still binds both); and a report VALUE that an input fed differently because the input changed between the two agents' post-reconnect report times (a tape transition between them, report pair inside a cut's window — e.g. effective.sim.checked_at from the LTE file)"
  streams = ["events", "telemetry", "status", "state", "report"]
  matcher = "reconnect_cadence"
  around_closed_ms = 5000
  event_exact = ["warn: reconnecting…", "warn: connection closed"]
  # NARROWED (review-wp7; made symmetric by fix-timer-cadence): `connected to …`
  # is NOT here — each agent must log it exactly #closed spans + 1 times;
  # `reconnecting…` / `connection closed` only with |Δ| ≤ #closed spans (either
  # side may have the extra one: independent 2 s phases); the transport-error
  # class either way; an unpaired telemetry tick at most ONE per side and span;
  # the report COUNT of a period overlapping a span only as modelled (|Δ| ≤
  # spans it overlaps, every extra report origin `cloud` with a rev the tape
  # published); a report VALUE only on a path an LTE-file change between the
  # two reports feeds.
  event_prefixes = ["error: <transport error>"]
  count_paths = ["published", "publishErrors"]

  [[rule.row]]
  id = "subscribe-fail-order"
  what = "a subscribe still awaiting its SUBACK at a drop fails once with `Connection closed` (mqtt.js _flushVolatile, client.js:794-803); Rust reports it just BEFORE the error/close events, the TS between `error` and `close` (WP1 follow-up amb. 4). The events stream is compared as a multiset, so the order never shows; counts must match"
  matcher = "doc_only"

  [[rule.row]]
  id = "disconnect-codec"
  what = "rumqttc 0.25.1 and a broker DISCONNECT (WP1 follow-up amb. 6 as corrected by review-wp1-followup MUST-FIX #1): a reason-code-only DISCONNECT is SILENTLY SWALLOWED — the close that follows shows as close-only when the broker sends TLS close_notify and as an `error` (<transport error>) + close when it does not; a zero-length DISCONNECT `[E0 00]` yields `Payload is required`. mqtt.js logs the disconnect + close. Never a reconnect loop, never data loss. Not reachable with mosquitto in the rig; whether AWS IoT Core sends these forms is unverified (bench capture). A mismatch of this shape on a bench tape is reported UNTOLERATED and judged against this row by hand. (A TLS peer-close WITHOUT close_notify producing an extra `mqtt error` is NOT tolerated: phase-2/integration removes it)"
  matcher = "doc_only"

  [[rule.row]]
  id = "tick-drift"
  what = "FLAG (rig, reviewer to confirm; A2): each agent re-arms from its own fire and drifts by its own wake-up lateness (Node setInterval; Rust `timer::SetInterval` since fix-timer-cadence — was tokio's fixed-rate interval), so the two agents' tick phases slide past each other; when the pair gap exceeds the rig's flip gap (`--flip-gap-ms`, 500 ms since series 5 = the nearest alignment; was 800) the hold gate flips roles and logs ONE lead tick as `skip` (pairs.ndjson). That tick's message is unpaired (within ±400 ms of the logged tick) and not value-compared; the values of every paired tick still are. CAPPED (re-review R5): at most ceil(run_s × |P_A − P_B| / 1000) + 1 such ticks per run, from each side's own mean tick period P (the phases slide |ΔP| ms per tick; one flip per 1000 ms of slide), else every hit is UNTOLERATED — JS-vs-JS (15 runs, series 4/5): |ΔP| ≤ 1.13 ms → cap 2 per 260 s, 0 skips observed (the pre-hysteresis 195214Z flapping, 25 skips, would fail). CADENCE (re-review R5): each agent re-arms its 1 s tick from the fire time (Node setInterval `listOnTimeout`; Rust `xorgate-agent` timer.rs `SetInterval`, every tick since fix-timer-cadence), so its mean period is 1000 ms + its wake-up lateness — measured in the rig: JS 1003.4–1007.4 ms, Rust 1001.7–1005.0 ms; |ΔP| JS-vs-JS ≤ 1.13 ms, JS-vs-Rust ≤ 3.12 ms (33 runs); re-measured after fix-timer-cadence (8 Phase 3 JS-vs-Rust runs 2026-10-19): JS 1001.68–1003.77, Rust 1002.68–1003.53, |ΔP| ≤ 1.24 ms — bounds unchanged. Each mean must lie in period_ms and |ΔP| ≤ max_period_delta_ms; a 1 % period error (10 ms) fails both. A |ΔP| ≥ 0.5 ms inside the bounds is listed as this row"
  streams = ["telemetry"]
  period_ms = [999.5, 1010.0]
  max_period_delta_ms = 4.0

  [[rule.row]]
  id = "fs-error-text"
  what = "failed atomic-write error TEXT (review-wp3 T8 item 1, shrunk per phase-2/integration): both agents now name Node's step and the temp file (`open '<dir>/.settings.json.tmp.<pid>.<n>'`, `rename '<tmp>' -> '<dest>'`, pathless write/fsync); only the temp file's `<pid>.<n>` differs per process and is normalised. Reaches state.json (warn) via `cloud config apply failed: …` (worker.ts:892) and `uploadBucket persist failed: …` (worker.ts:806) only on a failed write; not reachable in the rig"
  streams = ["events"]
  event_prefixes = ["cloud config apply failed: ", "uploadBucket persist failed: "]

  [[rule.row]]
  id = "rust-only-events"
  what = "Rust-only event `config report failed: …` (review-wp3 T8 item 2): emitted on `PublishFailure::Failed` (the report publish could not be queued); the TS wording exists (config-sync.ts:1567, a thrown publish) but mqtt.js queues offline and never reaches it in that case. Tolerated only when present on the Rust side and absent on the JS side"
  streams = ["events"]
  event_prefixes = ["config report failed: "]

  [[rule.row]]
  id = "write-error-survival"
  what = "state.json / pidfile write errors (wp1.md amb. #11; review-wp1 MUST-FIX #1 item 4): the TS throws from a timer and the process dies, Rust logs `[agent] state.json write failed: …` / `pidfile write failed` and continues. Consumer-invisible; not reachable in the rig unless the home is made unwritable — a JS crash with such a write error ends its streams (the diff then lists every later message as unpaired)"
  matcher = "doc_only"

  [[rule.row]]
  id = "task-prefix"
  what = "panics in supervised tasks are reported like unhandledRejection with an extra `<task>:` segment (wp1.md amb. #15; review-wp1 MUST-FIX #1 item 5): Rust `unhandledRejection: <task>: <msg>` vs TS `unhandledRejection: <msg>` (worker.ts:656-662) — the Rust side's `<task>: ` is stripped before comparing"
  streams = ["events", "state"]
  matcher = "task_prefix"

  [[rule.row]]
  id = "s3-error-text"
  what = "CF32 (review-wp5 MUST-FIX 1), shrunk by WP6 to WP3's unmapped list (wp3.md CF32 mapping table, last row): the suffix of `upload failed, retrying in Ns: <msg>` (uploader.ts:203 → manager.ts:265 → worker.ts:488-492) is folded ONLY for webpki UnknownIssuer (node: self-signed / unable to get local issuer), a SAN mismatch (node embeds the altnames), a corrupt-but-present PEM block, a key/cert mismatch, and node 20's multi-address AggregateError (empty message) — node side `fold_texts`, Rust side the raw `error_chain` fallback. The agent's own texts (`own_prefixes`, the TS strings of s3-put.ts / iot-creds.ts) and every text WP3 maps to node wording (`mapped_prefixes`: s3.rs node_transport_error, iot_creds.rs node_pem_error) are compared exactly"
  streams = ["events"]
  matcher = "suffix_after_prefix"
  event_prefixes = ["upload failed, retrying in "]
  own_prefixes = [
    "S3 PUT failed: HTTP ",
    "S3 PUT timed out",
    "IoT credentials fetch failed: HTTP ",
    "IoT credentials fetch timed out",
    "IoT credentials response missing fields",
    "IoT credentials response unparseable: ",
  ]
  mapped_prefixes = [
    "getaddrinfo ",
    "connect E",
    "socket hang up",
    "read ECONNRESET",
    "write EPIPE",
    "Client network socket disconnected before secure TLS connection was established",
    "certificate has expired",
    "certificate is not yet valid",
    "error:0480006C:PEM routines::no start line",
    "error:1E08010C:DECODER routines::unsupported",
  ]
  fold_texts = [
    "self-signed certificate",
    "unable to get local issuer certificate",
    "unable to verify the first certificate",
    "Hostname/IP does not match certificate's altnames",
    "PEM routines::",
    "asn1 encoding routines::",
    "DECODER routines::",
    "x509 certificate routines::key values mismatch",
    "",
  ]

[[rule]]
id = "T9"
title = "NO numeric-format tolerance: numbers are compared as their JSON text (1 vs 1.0 is a FAIL)"
basis = "phase file T9"
kind = "strict_numbers"

# ---------------------------------------------------------------- Phase 3
# T10–T14: phase-3-recording-media.md §Record/replay "What is compared, and
# how" (read by media_diff.rs; `tolerance` = the ± bounds in ms / counts).

[[rule]]
id = "T10"
title = "child spawn instants ±1 s (argv/env/signals/ended exact; stagger gap ≥ cfg per side); a kvs master SIGINT-stopped within flashMs of its spawn (the capture-spawn bounce racing the master's restart) may be absent on the other side — NARROWED (review-wp6): only when a capture of the SAME camera (the master's KVS_GST_PIPELINE camN) spawned within ±flashMs on that side, one flash per capture spawn"
basis = "phase file T10; flash: worker.ts:455 onCaptureSpawned → media.ts:51-59 restartChannel racing setDisabledCameras' release inside ONE agent (WP6 calibration rec-cameras JS-vs-JS: 4 vs 3 kvs cam1 spawns, the extra one stopped in the same ms); flashes are dropped from both sides only when that equalises the counts"
kind = "media"
streams = ["children"]
tolerance = { "spawnMs" = 1000.0, "flashMs" = 100.0 }

[[rule]]
id = "T11"
title = "session identity + anchor: sessionId, bootId, anchorTs, anchorMono"
