# Record/replay tolerance table — plan phase-2-cloud-plane.md §Record/replay,
# "Tolerance table". `xorgate-replay diff` cites the `id` of the row that
# covered every tolerated mismatch; a mismatch no row covers is UNTOLERATED and
# makes the diff exit non-zero (C3).
#
# Rules for editing (wp-specific-briefs.md WP7): T1-T9 come from the phase file;
# T7 rows are imported VERBATIM from phase-1/evidence/accepted-divergences.md
# (D1-D20), each with its pinning test. A NEW row (or a widened one) needs an
# O-decision or a reviewer's OK, cited in `basis` — never a silent widening.
#
# Path syntax: dot-separated JSON paths; `*` matches one segment (or part of
# one: `*At`), `**` any number of segments. Streams: telemetry, report, ack,
# status, sms, file:<name>, state, events, sudo, pidfile; Phase 3 (WP6,
# media_diff.rs): children, session, sidecar, mp4, rec-telemetry, s3,
# file:counters.json, evictions, shm.

version = 1

[[rule]]
id = "T1"
title = "ts-like fields are excluded; order is still checked"
basis = "phase file T1"
kind = "exclude"
streams = ["telemetry", "report", "ack", "status", "sms", "state", "file:config-sync.json", "file:commands.json", "file:gnss-sky.json", "pidfile"]
paths = ["ts", "**.*At", "*At", "**.at", "lastWriteAt", "connectionSince", "startedAt", "latest.ts", "entries.*.at", "**.ts", "*Ts", "**.*Ts", "timestamp",
  # Phase 3 (phase-3-recording-media.md table "payload media/recording blocks"):
  # backlogBytes counts mp4 sizes (encoder-dependent), `since` is the shed
  # start instant (lastUploadAt is covered by `*At`).
  "recording.backlogBytes", "**.recording.backlogBytes", "recording.liveBlock.since", "**.liveBlock.since",
  # Phase 5b (WP4; reviewer to confirm — same class as liveBlock.since): the OBD
  # status's `since` is the wall instant the collector entered its state
  # (ts:src/agent/collectors/obd.ts:292,337 `since = now()` @09da38d).
  "obd.since", "**.obd.since", "**.obd.status.since"]

[[rule]]
id = "T17"
title = "Phase 5b (WP4; orchestrator ruling 2026-10-28, replacing the ±1.5 cross-side band): the OBD helper's MEASURED request rate is a host measurement, NOT compared across sides. Each side must carry its OWN helper's value exactly (the carry checks in diff_p4::diff_obd_gate: report `effective.obd.profile.rate_req_s` = a rate its helper printed; state `obd.reqPerSec` = null, one of its helper's two latest probe rates, or requestRate() of two consecutive own audits), as a 1-decimal JS number, inside a per-side plausibility band (profile rate 5–40 req/s, state 0–40)"
basis = "python/obd/session.py:442-471 @09da38d: `rate = (requests − n0) / elapsed` over the ~0.35 s probe, `round(rate, 1)` — a ping-pong with the side's OWN emulator. TS passes it through unchanged: ts:src/agent/collectors/obd.ts:483-485 (`profile = rest`, the helper line without `type`) and :722 (`out.profile = profile` → effective.obd.profile); the state `reqPerSec` (:696, :666-677) is the seed `Math.round(seed * 10) / 10` of that 1-decimal value (identity) or requestRate() over the helper's own audits (:270-278), which the state carry check recomputes exactly. Host evidence (no agent at all, scratchpad wp4/rateexp: one emulator, the real helper): 16 idle probes 17.5–19.1, 16 with 2 busy cores 18.8–19.5, 8 with every core busy 19.6–19.8 — the rate tracks the VM's idle-core wake-up latency, so two sides' probes differ by host scheduling alone (JS-vs-JS up to 1.4 over 29 runs; JS-vs-Rust 2.1 / 2.5 / 1.8 in stepC r27.jsrs2 / r28.rsjs2 / r29.rsjs2, sign flipping with side order)"
kind = "numeric"
streams = ["report", "state"]
# The values are the per-side plausibility CEILING (40 req/s: twice the
# fastest of the 398 logged probes, 16.8–19.7); the floors are in code
# (diff.rs obd_rate_floor: 5 req/s for the probe rate — 200 ms a request,
# 4× slower than any probe seen; 0 for the state rate, which can be ~0.2
# across a silent ECU or a restart). A broken helper (0, NaN, 1000) FAILS;
# a value not carried from the side's own helper FAILS in diff_obd_gate.
# Pinned by diff::tests::t17_only_a_one_decimal_rate_within_one_req_s and
# diff_p4::tests::{obd_gate_waits_over_the_bound_or_timeouts_fail,
# state_req_per_sec_is_carried_from_its_own_helper}.
tolerance = { "effective.obd.profile.rate_req_s" = 40.0, "obd.reqPerSec" = 40.0 }

[[rule]]
id = "T2"
title = "seq compared as deltas; deviceId and requestId normalised to rig ids"
basis = "phase file T2"
kind = "deltas"
streams = ["telemetry", "state"]
paths = ["seq", "latest.seq"]
normalize_ids = true

[[rule]]
id = "T2"
title = "rig identities: a process id is per-instance like the deviceId"
