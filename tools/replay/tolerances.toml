[[rule]]
id = "T4/rec-sample"
title = "recorded telemetry VALUES (review-wp6 G1): per telemetry session and leaf (not T3's host-read paths), the run-length-deduplicated value sequences over the segments both sides hold are compared EXACTLY; one step carried by ONE sample may be absent on the other side only at a segment-stretch edge (±1 sample) or (NARROWED, review-wp6 re-check) where the OTHER side's sample nearest THE release that brought the step (the group's last input burst — releases ≤ 200 ms apart, an NMEA epoch spans ~60 ms — starting ≤ the step's sample and ≤ 1.1 s before it) lies within collisionMs of that burst (its tick raced that input); a hunk of ≥ 2 missing steps is never a race. ADDED (review-wp6 F4): a gps hunk where A holds ONE step (one sample) and B holds ONE other step (one sample) is two adjacent MISSES, one per side, only when content proves it and each miss passes the race test on its own: each side's NMEA lines (its agent tape at its own read instants; the player's releases for a JS side) are replayed through the agent's own core (FixAggregator + SkyTracker → map_latest, collectors/gps.rs), the two values are CONSECUTIVE values of that leaf in the same order on both sides, each holder's value became current on its side ≤ 1.1 s before its sample, and each lacking side's sample nearest the instant ITS missing value became current on THAT side lies within collisionMs; and (S-F4, re-review) every instant used is a Rust read within collisionMs of the player's release of the SAME line as written (the race window itself; measured max 14 ms under 15 busy loops) (releases.ndjson; the read path pty → tty thread → channel → run_stream stamp, gps.rs:251) — the anchor is never purely self-reported; anything else two-sided (a value the replay never produced, non-consecutive values, no race at either miss, no reads) stays UNTOLERATED. Per group (not system), the count of samples carrying it may differ by the group's T4 input transitions in the stretch (cited T4)"
basis = "phase file row `telemetry segments … sample metrics per T3/T4`; the recorder ticks on its own timer, ungated by the player (telemetry-recorder.ts:67-72 ↔ recording/telemetry.rs), so a 1 Hz input released within a few ms of a recorder tick lands on that tick or the next. WP6 2026-10-19 runs: JS-vs-JS 8/8 exact; JS-vs-Rust media/rec-shed-uv/rec-cameras each skip 1-2 NMEA steps where that side's tick fell 1-5 ms from the burst release (e.g. replay-20261019T151749Z Rust tick 29.655 vs burst 29.654). F4 (review-wp6 heavy run 1, 15 busy loops; WP6 gate run 033610Z): the recorder tick drifts (setInterval re-armed from each fire, telemetry-recorder.ts:67-72; mean 1003 ms under load) and its ts is stamped after the collectors are read (:90-125), so while its phase crosses the input's phase every sample is a coin flip per side: A ticking just before its read of epoch k+1 and B just after (same slot, both stamped 1792550521989) gives A: P X · N and B: P · Y N, which LCS shows as the substitution X/Y (lat/lon/alt 14.502373/14.502382 = consecutive fixes); likewise snr_max 32/31 (033610Z: becomes current at the GPGSV cycle's last line; B ticked 1 ms before it, A read 26 ms before its stamp). A step present on BOTH sides as values no adjacent epoch pair explains is never tolerated"
kind = "media"
streams = ["rec-telemetry"]
tolerance = { "collisionMs" = 50.0 }

[[rule]]
id = "T4/rec-input-between"
title = "Phase 5b (WP4, R-P3G-2; NEW RULE — reviewer sign-off required, rule 7): recorded-telemetry samples the two recorders legitimately took from DIFFERENT inputs. The recorders tick on their own setIntervals (each sample's READ instant = its fire, the lower envelope of ts − k·period, because ts is stamped after `await sampleGroups()`), so with an input faster than the gap between the two reads (the real 16 Hz IMU, an NMEA epoch landing between) a time-paired couple of samples (nearest read, ≤ 500 ms) reads different lines. A couple is removed from the per-leaf value comparison ONLY when (a) IMU leaves: BOTH samples pass the TAPE ORACLE — every metrics.imu.* leaf, as JS-number TEXT, equals `map_latest` (xorgate_core::imu_group, the TS mapLatest by parity) of one IMU line released before that side's read (+50 ms) and no more than 1.5 s before the newest such line (ORACLE_LAG_MS, review-wp4 R4-10, calibrated on the window tape); a STALE side fails outright when its median LAG — the newest input released by its read minus the input it matched — exceeds 500 ms in either group (ORACLE_STALE_MS; per side, so two recorders on different phases of the 1 s NMEA grid both pass), euler with the side's imuMount or none; (b) gps FIX leaves (fix_quality, satellites, satellites_in_view, hdop, lat, lon, alt, speed, course): the same oracle over the tape's NMEA fed through the fix aggregator (last 40 fix snapshots); (c) any other leaf: exactly ONE input change lies between the two reads and the couple is a strict old/new split. A side whose sample omits the group (not updated since its last write) counts as compatible only beside an oracle-verified sample (the count is the presence check's). A per-segment int/float shape difference of an (a)/(b) leaf is this row only when EVERY sample carrying it, on both sides, passes the oracle. Everything else (an unverified sample, a value the tape never released, a stale line, 1.0 written for 1, two changes with no oracle) is judged exactly by T4/rec-sample. The removed couples are listed per leaf"
basis = "ts:src/recording/telemetry-recorder.ts:67-72,96-106 @09da38d (own setInterval, ungated by the player; ts after the await; a group skipped when not updated) ↔ rs recording/telemetry.rs; ts:src/agent/collectors/imu.ts:81-106 mapLatest ↔ xorgate_core::imu_group::map_latest; ts:src/hardware/nmea.ts:263-298 ↔ xorgate_core::nmea::FixAggregator. Phase 3 gate D3a (window tape, JS-vs-JS): 457 untolerated (420 rec IMU + 36 rec gps) — with this rule 8 (1 children `ended` = the JS SIGTERM wedge, 1 gps samples-carrying count, 6 gps snr_max = sky leaves, not oracle-covered). Pinned by media_diff::tests::straddle_filter_drops_only_pairs_that_read_different_inputs, imu_oracle_verifies_only_genuine_recent_reads, read_instants_are_the_lower_envelope_of_the_grid Phase 5b WP4 extension (window-tape rulings, reviewer): the gps oracle also verifies the sky reductions `sats_heard` / `snr_max` (xorgate-core SkyTracker over the tape GSV cycles = ts:src/agent/collectors/gps.ts skyTracker.note), and `metrics.gps(samples carrying)` is tolerated under this id only when EACH side carries the group exactly at the samples the tape advanced the gps cache since that side previous read (ts:src/agent/collectors/gps.ts:160-190 onFix / GSV-without-position; media_diff::carry_consistent, test carry_consistent_follows_the_tape_advances_only)"
kind = "media"
streams = ["rec-telemetry"]

[[rule]]
id = "T12/interior-boundaries"
title = "INTERIOR video fragment (its successor exists on both sides): durationMs is judged as the difference of its two boundaries — its END (startTs + durationMs) relative to each side's own capture PLAYING within T12's startTs bound, like its start (row T12); the session's last fragment keeps T12 / T12/cut-fragment"
basis = "video-segments.ts:173-182: for seq ≥ 1 startTs = the mp4's birthtime (the file splitmuxsink opens at the rotation) and durationMs = mtime − birthtime (its last write at finalize), so an interior fragment's end is the next fragment's start (per side: end − next startTs within ±3 ms, gate run 035741Z) — two fs instants of each agent's own gst process. T12's durationMs ±150 is inconsistent with its own startTs ±300 once each encoder is starved independently: re-review run rr-m1 (15 busy loops + host overload) moved one interior boundary 272 ms (cam0#0/00003 startTs 409233 vs 409505) while the neighbour compensated (00002+00003 = 19998 vs 19839; 00004 starts ±30) — durations 8377 vs 8075. No new number: the end boundary gets the start boundary's bound. Plus, per side, the fragment's end must meet its OWN successor's startTs within FRAGMENT_SEAM_MS 50 (media_diff.rs; measured −42…0 ms over 240 seams under 15 busy loops), so a late finalize cannot pass inside ±300"
kind = "media"
streams = ["sidecar"]

[[rule]]
id = "T18/shm-js-end-of-run"
title = "end-of-run `shm` orphans, JS-vs-JS calibration ONLY (orchestrator ruling 2026-11-06): the two JS references' orphan COUNTS may differ only by END-OF-RUN orphans — every orphan on both sides is explained (arm (a) reaper miss: owner capture gone before the player's SIGTERM with a padded name; arm (b) end of run: owner capture still running at the SIGTERM of a JS agent that hung past 30 s and was SIGKILLed) and the arm-(a) counts are EQUAL. A difference that includes an arm-(a) orphan, or any unexplained orphan (a late orphan of a JS side that exited gracefully, a 5+ digit mid-run one, an owner never seen gone), stays UNTOLERATED; JS-vs-Rust is T7/D41 (Rust orphans always UNTOLERATED); Rust-vs-Rust exact"
basis = "The reference's own nondeterminism from the documented JS SIGTERM hang (js-bug-triage bug 3 / P7): ts:src/worker.ts:1473-1507 @09da38d shutdown() SIGINTs every capture (recording.stop() → video-capture.ts:493-507 stop(), not awaited), then the wedged event loop never reaches process.exit, and the player SIGKILLs the agent's group after 30 s (play.rs wait_stopped). Whether a capture finished its EOS (shmsink unlinks its own area) or died mid-EOS with the hung agent's onExit reaper never running (video-capture.ts:736 → :873-891) is a race per side. Observed: rec-preset.cal.rv1 A [1196 (a)] vs B [1195 (a), 5832 (b): 'handling interrupt.' at +15 ms, gone +138 ms after the SIGTERM; both agents 'did NOT exit in 30 s'], then rv2/rv3 equal. Pinned by media_diff::tests::shm_orphans_count_padded_names_and_a_strand_fails (JS-vs-JS arms + negatives)"
kind = "media"
streams = ["shm"]

[[rule]]
id = "T14"
title = "S3 PUT timing / failed-attempt counts (NARROWED review-wp6: |Δ| ≤ 1 per meta.rig.s3Faults window edge, exact without faults), and a session's LAST fragment or LAST telemetry segment (newest seq of that session on either side, and the side without the PUT holds it or never got that far) present on one side only — never a middle segment; telemetry bodies compared decompressed (rec-telemetry), mp4 body hash not compared"
basis = "phase file T14"
kind = "media"
streams = ["s3"]

# ---------------------------------------------------------------- Phase 4
# T15–T16: phase-4-operations.md §8 "Diff streams added" (read by
# crates/xorgate-replay/src/diff_p4.rs; `tolerance` = the ± bounds). PROVISIONAL
# until the WP6 JS-vs-JS calibration + the adversarial review cite runs.

[[rule]]
id = "T15"
title = "LED pin timeline: per-step interval ±step_ms; heartbeat-rendered run starts (every logged render but `none → …`) on each agent's OWN heartbeat grid (k·1000 ± spawn_ms + k·drift_ms_per_tick since the previous one: the render's first pinctrl spawn latency) with a constant cross-agent offset (± the same slack; spawn_ms < 500 so a whole-heartbeat shift is never absorbed); a whole-heartbeat shift of that offset is UNTOLERATED except on a rung whose input is produced on an own-phase timer (undervoltage/thermal via the shed tick + publish loop: ≤ 2; leaving network on the 2 s reconnect: ≤ 2); a run's group count may differ by what its duration difference plus the summed measured per-leg differences buy at the pattern's shortest leg (+1). Pin/level sequences and the ordered `[led] a → b` transitions are exact; event-driven runs (`none → …`, the flash, a blank) are compared by structure + steps only"
basis = "step: led.ts:356-396 awaits the pinctrl spawn then setTimeout(step.ms) — Node timers vs tokio + one process spawn per leg (`led-jitter`, phase file §8). Grid: led-manager.ts:56-73 renders from tick(), driven by the worker's 1 s heartbeat setInterval (worker.ts:633-638), so a rung change lands on that agent's own heartbeat; drift: Node's setInterval drifts ~1 ms/tick (README hold-gate notes), Rust's SetInterval re-arms from the fire (timer.rs). Spawn: led.ts:219-225 pinctrlWriter = run('pinctrl', …) — a process spawn per write, stamped by the shim after it started; observed render offsets from the k·1000 grid 100–220 ms under the media load (replay-20261019T233553Z, T221223Z JS-vs-JS), bound 400 (< 500 by construction). Chains: shed tick manager.ts:612-615 → noteRecordingStatus worker.ts:1207 → heartbeat; reconnect mqtt.ts:63 `reconnectPeriod: 2000`. review-wp6 M1 (replaces the ±1150 ms phase bound, which accepted a Rust render one heartbeat late)"
kind = "p4"
streams = ["led"]
tolerance = { "step_ms" = 50.0, "drift_ms_per_tick" = 2.0, "spawn_ms" = 400.0 }

[[rule]]
id = "T16"
title = "clock-stepper values stamped at THAT agent's tick: (sudo) `xorgate-setclock <epoch>` compared as the offset epoch − (the shim's call time, rounded s), ±epoch_s; (events) `[clock] ignoring implausible <src> time <ISO>` — an A-only and a B-only line, same level + source, whose ISO minus the event's OWN state.json ts (= the source offset) agree within ±anchor_ms"
basis = "clock-step.ts:186 `String(Math.round(targetMs / 1000))` with targetMs = gps.utcMs + gps.ageMs (or now + modem.offsetMs) evaluated at THAT agent's 30 s tick (clock-step.ts:291 setInterval from its own start), so the absolute epoch differs by the two tick phases; the offset from the call's own time is the comparable value, and two roundings (the target's and the call time's) put it within ±1 s. Events: clock-step.ts:262 targetMs = now() + modem.offsetMs (GPS: utcMs + ageMs) printed by :274 `new Date(targetMs).toISOString()` — `now()` is that agent's tick instant; both steppers start after their own boot (worker.ts:554, first tick immediate) and keep that phase, so the ISOs differ by the boot skew (p4-clock-cap: JS-vs-JS 3 ms, JS-vs-Rust 149 ms; replay-20261020T013620Z / T014855Z) — anchored instead to each event's own `Date.now()` stamp (worker.ts:546-551, same tick as `now()`), which removes the phase: the difference left is the in-tick processing (ms) (review-wp6 should-fix)"
kind = "p4"
streams = ["sudo", "events"]
tolerance = { "epoch_s" = 1.0, "anchor_ms" = 50.0 }

[[rule]]
id = "T16/trust-published"
title = "clock-trust late-sync text stamped at THAT agent's instants (F-P2-ROUND, Phase 7e): `[clock] <src> synchronized <T> s after boot — clock trusted (published <P> s on an untrusted clock)` — ONE A-only and ONE B-only line that differ ONLY in P, by at most ±published_s, each P derived from that side's OWN grace and trust instants (±instant_ms), each side |T − G − P| ≤ 1 on its OWN grace G, the two trust instants and the two grace instants each < apart_ms apart"
basis = "TS @09da38d: ts:src/agent/clock-trust.ts:104-106 `secs(ms) = (ms / 1000).toFixed(0)`; :121 prints T = secs(monoMs() − startedMono) and P = secs(monoMs() − startedMono − heldMs); heldMs is the grace flip's elapsed (:129 `elapsed = monoMs() − startedMono`, :132 `heldMs = elapsed`, :135 prints G = secs(elapsed); :113 leaves heldMs alone on the late path), so raw P = mono(trust) − mono(grace flip): the start cancels and P is a function of the side's OWN two instants. Both events are stamped in the same synchronous call as their monoMs() reads: establish() → event() → onEvent `const t = Date.now(); store.event(level, msg, t)` (ts:src/worker.ts:477-483), no await between. The trust instant is the step on THAT agent's own 30 s stepper tick (ts:src/agent/clock-step.ts:69, :291 setInterval from its own start; :285 onStepped → ts:src/worker.ts:614 clockTrust.noteStep), the grace flip the first trust check past 300 s of its own start (:127-131 via ts:src/worker.ts:1409 or the 5 s poll :147-152); each phase is that agent's own (the T16 boot skew), so raw P differs per agent by tens to hundreds of ms and, near x.5 s, rounds to either side. Rust reproduces the formula exactly: crates/xorgate-core/src/clock_trust.rs:120-122 trust_secs = js::to_fixed(ms / 1000, 0) (ties away from zero, as toFixed; js.rs:341-378), :134-143 late_trusted_event, :198-218 establish (since − held_ms), :222-236 check_grace (held_ms = elapsed); stamped synchronously by crates/xorgate-agent/src/ops/clock_trust.rs:221-229 perform → crates/xorgate-agent/src/ops/clock_stepper.rs:322-336 agent_event_sink (`clock.wall_ms()`). So the split is NOT a Rust rounding or formula divergence and no D-row is needed (like T16 and T8/grace-fallback-phase): it is a per-agent-instant row. Evidence: P2 rerun 1 (A grace→trust 30 543 ms prints 31, B 30 439 ms prints 30), Phase 7e combined gate B-p4-clock-cap (A 30 554 → 31, B 30 403 → 30) and .r2 (A 30 162 → 30, B 30 520 → 31), T 331 equal on both sides in all three; the row fired in 4 of 14 JS-vs-Rust p4-clock-cap runs (P2, 5b, 7a, E3, combined). BOUNDS: (1) per side, P ∈ [secs(d − instant_ms), secs(d + instant_ms)] with d = the trust event's state.json stamp − the grace event's stamp: the side prints what its own instants say (instant_ms = T16's anchor_ms: the in-call processing between the monoMs() read and the stamp, both synchronous); (2) per side, |T − G − P| ≤ 1 (each of T, G, P is toFixed(0) of its own raw ms with raw T = raw G + raw P, so each rounding error in [−0.5, +0.5) gives P ∈ {T − G − 1, T − G, T − G + 1}; diff.rs trust_tgp_ok, shared with D40); (3) across sides, |P_A − P_B| ≤ published_s = 1: toFixed(0) of raws that lie less than 1 s apart differ by at most 1, and that is this class (raw P 151 and 358 ms apart in the combined gate's two runs); a ±2 split needs raw P ≥ 1 s apart, which is not a rounding split, and FAILS; (4) the two trust instants and the two grace instants each < apart_ms = 1 s apart (one tick, each agent on its own phase; the grace row's bound). EXACT, and UNTOLERATED otherwise: the source, T (its raw value is one instant since each side's OWN start, not two timers apart; never seen split), every other character of the text (canonical digits, re-formatted), presence and count (exactly ONE late-trust event and ONE grace warning per side, the trust after the warning, and exactly two UNTOLERATED rows naming a trust text: one A-only 1/0, one B-only 0/1), any other `[clock]` text, handoff runs (two eras) and every other stream. The events stream is a multiset; this row adds no ordering freedom. D40 keeps first claim on its race shape (it runs before this row; this row touches only rows still UNTOLERATED). Kind-agnostic (JS-vs-Rust, JS-vs-JS, Rust-vs-Rust): the instants are per agent whatever its kind. Pinned by diff_p4::tests::trust_published_only_a_one_second_rounding_split (±1 tolerated; ±2, another source, another T, a missing / extra / unpaired message, a P its own instants do not print, |T − G − P| = 2, instants ≥ 1 s apart, a handoff run: all FAIL) and diff_p4::tests::trust_published_reproduces_the_combined_gate_runs"
kind = "p4"
streams = ["events"]
tolerance = { "published_s" = 1.0, "instant_ms" = 50.0, "apart_ms" = 1000.0 }

# ---------------------------------------------------------------------------
# Phase 5b (WP4) — RIG INPUT GATING, NOT A TOLERANCE (documented here because
# it decides which inputs the first post-hold pair saw; no `[[rule]]`, so no
# mismatch can ever cite it):
#
# POST-HOLD SETTLE (play.rs `Gate::expect_resume` / `post_hold_hold`). While the
# clock trust gate holds an agent's live publish (ts:src/worker.ts:1405-1411
# @09da38d: the payload is built, `seq` advanced and `setLatest` done, then the
# return; no telemetry, no state.json flush), the hold gate cannot observe that
# agent's 1 s tick phase. Trust is established at instants the player can see:
# the tape's NTP flip (seen on the next 5 s probe, ts:src/agent/clock-trust.ts
# :66-70 pollMs), the agent's own GPS/NITZ step (`noteStep`, ts:src/worker.ts:614;
# its `xorgate-setclock` sudo line), or the 300 s grace fallback (graceMs, first
# poll past it, ts:src/agent/clock-trust.ts:126-137). From that instant until the
# held agent's FIRST telemetry publish (capped: NTP 11 s, fallback 8 s, step
# 2.5 s) the barrier inputs (LTE file, cli, mqtt_in, conn) wait, exactly as they
# wait for a reconnecting agent after a cut (post_cut_hold). It only delays
# inputs; every pair is still compared strictly, nothing is skipped or
# re-paired, and a resumed agent that is late beyond the cap or early is judged
# as before (tests play.rs post_hold_settle_waits_for_the_first_post_trust_tick_only,
# post_hold_settle_never_waits_past_its_cap_nor_counts_an_early_tick). Found by
# sweep-A p4-clock-cap (an LTE rewrite at 300.08 s split the first post-fallback
# pair: phase-5b/evidence/delta-inventory.md).
#
# NTP PROBE LATENCY (p5b-clock-hold only; `meta.rig.ntpProbeDelayMs`, the
# timedatectl shim): the clock-trust probe and the RecordingManager's settings
# poll are both 5 s setIntervals (ts:src/agent/clock-trust.ts:66-70,158-163;
