kind = "exclude"
streams = ["state", "pidfile"]
paths = ["pid"]

[[rule]]
id = "T3"
title = "system metrics read live from the rig host (both agents, minutes apart at most)"
basis = "phase file T3"
kind = "numeric"
streams = ["telemetry"]
# throttled / rail_5v / psu_max_current are tape-fed and therefore EXACT (no row).
tolerance = { "metrics.system.cpu_usage.value" = 10.0, "metrics.system.ram_usage.value" = 1.0, "metrics.system.disk_usage.value" = 0.1, "metrics.system.cpu_temp.value" = 0.5 }
# Rig artifact, not a widening (FLAG: reviewer to confirm): both agents read the
# rig's live /proc/meminfo, and a concurrent load on the shared Docker VM (other
# worktrees' cargo builds) moves ram_usage by several points between the two
# agents' tick instants (observed 18→52 % within 1 s, JS-vs-JS). The player
# samples the same formula every 50 ms (`host.ndjson`); a ram difference beyond
# ±1 is cited as `T3/host` ONLY if the host's own series swung by at least the
# excess between the two `ts` (±250 ms), else it stays UNTOLERATED. On the bench
# tape replay in a quiet VM this never fires. Phase 3 (WP6): a media run's own
# load (four x264 encoders + shmsink segments) swings the host ram by ~3 points
# within 50 ms, so the host sample nearest `ts` is not the one an agent read;
# a host pair from each agent's read window [ts − 150, ts + 250] ms that
# explains the difference (same sign, within ±1) is also `T3/host`.
# cpu_usage likewise (JS-vs-Rust, pairs up to ~0.9 s apart while the two tick
# phases differ): the player samples /proc/stat, and a cpu difference beyond
# ±10 is `T3/host` only if the host's own busy share over the two agents' 1 s
# windows (ending at each `ts`) differs by at least the excess.
# BIAS GUARD (review-wp6 FLAG 1, narrowed): per run and host-referenced field,
# if the median signed A − B over ALL telemetry pairs exceeds ½·tol, or
# T3/host covers more than 5 % of the pairs, every T3/host row of that field
# is UNTOLERATED (host swing explains noise, never a systematic formula error);
# diff.md prints both figures (`T3/host bias guard …`).
host_reference = { "metrics.system.ram_usage.value" = "ram", "metrics.system.cpu_usage.value" = "cpu" }

[[rule]]
id = "T4"
title = "group/field presence may differ within ±1 tick of an input transition and in the first 5 s"
basis = "phase file T4"
kind = "presence_window"
streams = ["telemetry"]
startup_ms = 5000
# ±1 tick (1000 ms at 1 Hz) + 500 ms for the phase offset between the agents.
window_ms = 1500
# Per GROUP (review-wp7 finding 3; the old single list covered 65-94 % of the
# run): a presence difference under `metrics.<group>` is T4/<group> only within
# ±window of THAT group's input transitions, derived by the diff from the tape:
#   gps    ← NMEA first line, stop (gap > 2 s), stale (+10 s), resume, GGA quality change, end (+10 s)
#   imu    ← imu_spawn / imu_exit, IMU line stream start/stop (gap > 2 s), i2cdetect
#   lte    ← lte_file changes
#   system ← per FIELD (re-review R6): metrics.system.throttled ← `vcgencmd
#            get_throttled`, .rail_5v ← `vcgencmd pmic_read_adc`,
#            .psu_max_current ← dt; the host-read fields (cpu/ram/disk/cpu_temp)
#            and the whole system group: only the first 5 s
# Never mqtt_in / cli / conn. Any other path: only the first 5 s. diff.md prints
# each group's (system: each field's) window coverage (% of the run).
# All instants are the player's ACTUAL releases (releases.ndjson, re-review R1).

[[rule]]
id = "T4"
title = "media/recording state transitions may land one tick apart (the other side shows this value at the adjacent tick)"
basis = "phase-3-recording-media.md §Record/replay table, row `payload media/recording blocks`: transitions ±1 tick (T4)"
kind = "transition"
streams = ["telemetry"]
paths = ["media", "media.**", "recording", "recording.**"]

[[rule]]
id = "T5"
title = "report count may differ by ±1 where two triggers straddle the 2 s debounce; the last report of every quiet period must be identical"
basis = "phase file T5"
kind = "report_count"
streams = ["report"]
max_count_delta = 1
quiet_ms = 10000

