# Record/replay tolerance table — plan phase-2-cloud-plane.md §Record/replay,
# "Tolerance table". `xorgate-replay diff` cites the `id` of the row that
# covered every tolerated mismatch; a mismatch no row covers is UNTOLERATED and
# makes the diff exit non-zero (C3).
#
# Rules for editing (wp-specific-briefs.md WP7): T1-T9 come from the phase file;
# T7 rows are imported VERBATIM from phase-1/evidence/accepted-divergences.md
# (D1-D20), each with its pinning test. A NEW row (or a widened one) needs an
# O-decision or a reviewer's OK, cited in `basis` — never a silent widening.
#
# Path syntax: dot-separated JSON paths; `*` matches one segment (or part of
# one: `*At`), `**` any number of segments. Streams: telemetry, report, ack,
# status, sms, file:<name>, state, events, sudo, pidfile.

version = 1

[[rule]]
id = "T1"
title = "ts-like fields are excluded; order is still checked"
basis = "phase file T1"
kind = "exclude"
streams = ["telemetry", "report", "ack", "status", "sms", "state", "file:config-sync.json", "file:commands.json", "file:gnss-sky.json", "pidfile"]
paths = ["ts", "**.*At", "*At", "**.at", "lastWriteAt", "connectionSince", "startedAt", "latest.ts", "entries.*.at", "**.ts", "*Ts", "**.*Ts", "timestamp"]

[[rule]]
id = "T2"
title = "seq compared as deltas; deviceId and requestId normalised to rig ids"
basis = "phase file T2"
kind = "deltas"
streams = ["telemetry", "state"]
paths = ["seq", "latest.seq"]
normalize_ids = true

[[rule]]
id = "T2"
title = "rig identities: a process id is per-instance like the deviceId"
basis = "phase file T2 (deviceId/requestId normalised); WP7 reading — pid is the same kind of per-instance identity (reviewer to confirm)"
kind = "exclude"
streams = ["state", "pidfile"]
paths = ["pid"]

[[rule]]
id = "T3"
title = "system metrics read live from the rig host (both agents, minutes apart at most)"
basis = "phase file T3"
kind = "numeric"
streams = ["telemetry"]
# throttled / rail_5v / psu_max_current are tape-fed and therefore EXACT (no row).
tolerance = { "metrics.system.cpu_usage.value" = 10.0, "metrics.system.ram_usage.value" = 1.0, "metrics.system.disk_usage.value" = 0.1, "metrics.system.cpu_temp.value" = 0.5 }
# Rig artifact, not a widening (FLAG: reviewer to confirm): both agents read the
# rig's live /proc/meminfo, and a concurrent load on the shared Docker VM (other
# worktrees' cargo builds) moves ram_usage by several points between the two
# agents' tick instants (observed 18→52 % within 1 s, JS-vs-JS). The player
# samples the same formula every 50 ms (`host.ndjson`); a ram difference beyond
# ±1 is cited as `T3/host` ONLY if the host's own series swung by at least the
# excess between the two `ts` (±250 ms), else it stays UNTOLERATED. On the bench
# tape replay in a quiet VM this never fires.
# cpu_usage likewise (JS-vs-Rust, pairs up to ~0.9 s apart while the two tick
# phases differ): the player samples /proc/stat, and a cpu difference beyond
# ±10 is `T3/host` only if the host's own busy share over the two agents' 1 s
# windows (ending at each `ts`) differs by at least the excess.
host_reference = { "metrics.system.ram_usage.value" = "ram", "metrics.system.cpu_usage.value" = "cpu" }

[[rule]]
id = "T4"
title = "group/field presence may differ within ±1 tick of an input transition and in the first 5 s"
basis = "phase file T4"
kind = "presence_window"
streams = ["telemetry"]
startup_ms = 5000
# ±1 tick (1000 ms at 1 Hz) + 500 ms for the phase offset between the agents.
window_ms = 1500
# Transitions: lte_file change/absence, i2cdetect, imu_spawn/imu_exit, exec
# change, conn, mqtt_in, cli, NMEA stream start/stop (gap > 2 s) and GGA
# fix-quality changes; plus gaps > 2 s in the IMU line stream.

[[rule]]
id = "T5"
title = "report count may differ by ±1 where two triggers straddle the 2 s debounce; the last report of every quiet period must be identical"
basis = "phase file T5"
kind = "report_count"
streams = ["report"]
max_count_delta = 1
quiet_ms = 10000

[[rule]]
id = "T6"
title = "phase-owned gaps until Phase 3/4"
basis = "phase file T6; scope boundary table; CF30"
kind = "phase_owned"
streams = ["telemetry", "report", "state", "events", "sudo"]
paths = [
  "media", "media.**",
  "recording", "recording.**",
  "status.bootDefer", "status.bootDefer.**", "status.powerShed", "status.powerShed.**",
  "effective.recording.bootDefer", "effective.recording.bootDefer.**",
  "effective.recording.powerShed", "effective.recording.powerShed.**",
  "**.clockStepperArmed",
  "effective.cameraMount", "effective.cameraMount.**",
]
# state.json `recentEvents` msg prefixes owned by Phase 3/4.
# `[clock]` = the offline clock stepper (clock-step.ts:232 etc., wired at
# worker.ts:536-554), re-deferred to Phase 4 by CF20; its report hint
# `clockStepperArmed` is already a T6 path above. FLAG: reviewer to confirm.
event_prefixes = ["hardware:", "camera mount", "camera-mount", "led", "LED", "recording", "media", "[media", "upload", "[clock]"]
# sudo argv owned by Phase 3/4 (camera-mount helper, set-clock helper).
sudo_argv_contains = ["xorgate-camrotate", "xorgate-setclock", "camrotate", "setclock"]

[[rule]]
id = "T7"
title = "Phase 1 accepted divergences (phase-1/evidence/accepted-divergences.md D1-D20)"
basis = "phase file T7; accepted-divergences.md"
kind = "import"
source = "phase-1/evidence/accepted-divergences.md"

  [[rule.row]]
  id = "D1"
  what = "SMS lone surrogate in an incomplete UCS2 concat: TS \\ud83d escape, Rust U+FFFD"
  streams = ["sms"]
  matcher = "fffd_vs_lone_surrogate"
  pinned_by = "sms_pdu::tests::lone_surrogate_in_incomplete_concat_becomes_replacement_char"

  [[rule.row]]
  id = "D2"
  what = "reportedString 64-unit cut inside a surrogate pair: lone \\ud83d vs U+FFFD"
  streams = ["report"]
  matcher = "fffd_vs_lone_surrogate"
  pinned_by = "config_report::tests::reported_string_cut_inside_a_surrogate_pair_is_fffd"

  [[rule.row]]
  id = "D3"
  what = "JSON.parse vs serde_json: 1e400 / lone-surrogate escapes / nesting > 128 reject the whole text in Rust"
  streams = ["telemetry", "report", "ack", "file:settings.json", "file:commands.json"]
  matcher = "doc_only"
  pinned_by = "settings::tests::serde_json_is_stricter_than_json_parse"

  [[rule.row]]
  id = "D4"
  what = "lossy UTF-8 reads (TS readFileSync utf8 / payload.toString())"
  matcher = "doc_only"
  pinned_by = "Phase 2 HAL rule (String::from_utf8_lossy before the core parser)"

  [[rule.row]]
  id = "D5"
  what = "settings_migrate saved key order when recording/video/cameras was absent (one-shot mediaEnabled:false migration)"
  streams = ["file:settings.json"]
  matcher = "same_json_different_key_order"
  pinned_by = "doc only (settings_migrate.rs module doc)"

  [[rule.row]]
  id = "D6"
  what = "commands.json ledger entry with unknown keys: Rust writes requestId, at, …extras"
  streams = ["file:commands.json"]
  matcher = "same_json_different_key_order"
  pinned_by = "doc only (commands.rs LedgerEntry.extra)"

  [[rule.row]]
  id = "D7"
  what = "re-serialised ModemTelemetry / PowerSampleReading null fields omitted"
  matcher = "doc_only"
  pinned_by = "doc only (types.rs module comment)"

  [[rule.row]]
  id = "D8"
  what = "GPS group key order from a SIMULATED source"
  streams = ["telemetry"]
  matcher = "doc_only"
  pinned_by = "doc only (telemetry.rs GpsGroup)"

  [[rule.row]]
  id = "D9"
  what = "Date.parse without an offset: TS local time, Rust UTC (rig runs TZ=UTC)"
  matcher = "doc_only"
  pinned_by = "js::tests::date_parse_accepted_divergences"

  [[rule.row]]
  id = "D10"
  what = "Date.parse legacy non-ISO forms: TS parses, Rust NaN"
  matcher = "doc_only"
  pinned_by = "js::tests::date_parse_accepted_divergences"

  [[rule.row]]
  id = "D11"
  what = "IMU partial sample line: Rust rejects it and keeps the previous sample"
  streams = ["telemetry"]
  matcher = "doc_only"
  pinned_by = "imu::tests::partial_sample_is_rejected"

  [[rule.row]]
  id = "D12"
  what = "NMEA malformed numeric field: NaN vs None (both absent on the wire)"
  matcher = "doc_only"
  pinned_by = "tests/nmea_fixtures.rs [extra] unparseable numeric fields"

  [[rule.row]]
  id = "D13"
  what = "sortInterfaces localeCompare (ICU) vs ASCII"
  matcher = "doc_only"
  pinned_by = "network::tests::sort_interfaces_icu_divergences"

  [[rule.row]]
  id = "D14"
  what = "toISOString beyond ±8.64e15: RangeError vs \"Invalid Date\""
  matcher = "doc_only"
  pinned_by = "js::tests::iso_string_matches_v8 (±(8.64e15 + 1), ±Infinity, NaN)"

  [[rule.row]]
  id = "D15"
  what = "modem telemetry health an inherited key (\"toString\"): gnss_health {} vs not emitted"
  matcher = "doc_only"
  pinned_by = "doc only (modem::lte_group)"

  [[rule.row]]
  id = "D16"
  what = "modem telemetry non-string timestamp (modem::lte_group AND readModemBias / config_report::modem_bias_from_telemetry): stringified / Date.parse(String(n)) vs None (lte key absent; bias stale, fresh:false)"
  matcher = "doc_only"
  pinned_by = "doc only"

  [[rule.row]]
  id = "D17"
  what = "throttled mask > 16 hex digits: precision loss vs saturation"
  matcher = "doc_only"
  pinned_by = "doc only (system.rs)"

  [[rule.row]]
  id = "D18"
  what = "sky-state mono arithmetic: negative vs saturating_sub"
  matcher = "doc_only"
  pinned_by = "doc only (sky_state.rs)"

  [[rule.row]]
  id = "D19"
  what = "toFixed digits > 100: RangeError vs assert"
  matcher = "doc_only"
  pinned_by = "doc only (js::to_fixed)"

  [[rule.row]]
  id = "D20"
  what = "build-info fallback channel: \"local\" + package version vs \"dev-local\" + baked sha (Phase 0 decision)"
  streams = ["report"]
  matcher = "doc_only"
  pinned_by = "xorgate-agent::build_info tests"

[[rule]]
id = "T8"
title = "Phase 2 orchestrator decisions"
basis = "phase file T8; O2, O3, O4; WP1 brief (publish while disconnected); README §6 (build identity)"
kind = "decisions"

  [[rule.row]]
  id = "O2"
  what = "O2 mono-vs-wall intervals — the five the TS measures on Date.now(): the gps reopen watchdog (30 s), NMEA freshness (10 s), TTFF, the gnss-sky.json 15 s cadence, the refresh 30 s window — PLUS WP2's lte/system `sample()` 1 s cache gates (collectors/lte.ts, system.ts:94-114), all on mono in Rust. Values are identical unless the wall clock steps: tolerated only within a window around a tape `clock` event that shows a wall step"
  matcher = "wall_step_window"

  [[rule.row]]
  id = "O3"
  what = "`update` sudo argv names xorgate-updater-rs.service"
  streams = ["sudo"]
  normalize = { "xorgate-updater-rs.service" = "xorgate-updater.service" }

  [[rule.row]]
  id = "O4"
  what = "real-mode read_sms: sms result status:error \"sms reader not available in this build\""
  streams = ["sms"]
  matcher = "read_sms_unavailable"

  [[rule.row]]
  id = "pidfile"
  what = "pidfile worker / argv / nodeVersion (CF4)"
  streams = ["pidfile"]
  paths = ["worker", "argv", "argv.**", "nodeVersion"]

  [[rule.row]]
  id = "writtenBy"
  what = "state.json writtenBy"
  streams = ["state"]
  paths = ["writtenBy"]

  [[rule.row]]
  id = "build"
  what = "the agent's own build identity in the report (README §6, Q7: each agent reports its own build)"
  streams = ["report"]
  paths = ["effective.agent.build", "effective.agent.build.**"]

  [[rule.row]]
  id = "set-wifi"
  what = "`set wifi` is Phase 4 (CF22; WP6 T8): Rust prints `xorgate-rs: 'set wifi' arrives in a later build` and exits 1 before the sudo note (cli_set.rs:44) where the TS runs set.ts:679-717. C11: stdout/stderr/exit differ; settings.json must still be identical (untouched)"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-banner"
  what = "build identity + usage (README §6, Q7; WP6 A5; review-wp6 item 2 — NOT D20, which is the build-info fallback channel): `-v` prints `xorgate-rs <build>` vs `xorgate <ver>` (version.rs:1-15 vs cli.tsx:24-26,64-67); `help` / no verb / an unknown verb print the SHORTER Rust usage (only this binary's verbs: run/status/set/logs; cli.rs usage()) vs cli.tsx's. C11: stdout differs; exit code and stderr must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-systemd-verbs"
  what = "`start` / `stop` / `restart` (WP6 A5; README §3.3 drops the self-managed daemon): Rust prints `xorgate-rs: '<verb>' is systemd's job for the Rust agent: sudo systemctl <verb> xorgate-agent-rs` and exits 1 (cli.rs) where the TS manages its detached worker (manager.ts start/stop/restart). C11: stdout/stderr/exit differ; settings.json must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-later-verbs"
  what = "verbs owned by Phase 3/4 (`update`, `pipeline`, `recording`, `led`, `sms`, `manage`, `monitor`; WP6 A5): Rust prints `xorgate-rs: '<verb>' arrives in a later build` and exits 1 (cli.rs) — the TS has these verbs, so `unknown command` would be wrong. C11: stdout/stderr/exit differ; settings.json must match. Retire each verb's row when its phase lands"
  streams = ["cli"]

  [[rule.row]]
  id = "logs-journal"
  what = "O9: with no $XORGATE_HOME/agent.log the Rust `logs` execs `journalctl -u xorgate-agent-rs -n N` (logs.rs:59-72) where the TS prints the empty-log text (logs.ts). C11: stdout/stderr/exit differ when the home has no agent.log; with an agent.log both must match"
  streams = ["cli"]

  [[rule.row]]
  id = "set-mode-running"
  what = "WP6 A3: `set mode <m>` while an agent is running — the TS restarts its self-managed daemon (set.ts:515-530: stop + start with the pidfile argv), Rust (systemd only, README §3.3) prints `could not restart automatically: …` + the `sudo systemctl restart xorgate-agent-rs` hint and exits 1 (cli_set.rs:54-63), the shape of the TS failure branch :527-529. C11: stdout/stderr/exit differ; settings.json must be identical"
  streams = ["cli"]

  [[rule.row]]
  id = "rig-cut-ungated"
  what = "RIG limitation (FLAG, reviewer to confirm): while the broker path is cut the hold gate cannot observe ticks (publishes are queued), so inputs are released ungated and the VALUES of telemetry/status stamped inside a closed span (extended until BOTH agents publish again) ±5 s may differ by one input sample; they are not value-compared. Message presence and counts still are (see reconnect-cadence / offline-queue-bound). Replaces the earlier `cadence` row: publishing while disconnected is now parity (WP1 follow-up; Phase 0 deviation #8 gone)"
  streams = ["telemetry", "status"]
  around_closed_ms = 5000

  [[rule.row]]
  id = "offline-queue-bound"
  what = "offline queue bound (WP1 follow-up amb. 1): Rust caps the QoS 1 store and the QoS 0 queue at 1000 each, oldest dropped (xorgate-cloud mqtt.rs OFFLINE_QUEUE_LIMIT); mqtt.js is unbounded (client.js:1081-1096). Past ~16.7 min of outage at 1 Hz the TS flushes more stale telemetry and counts more `published`; a Rust seq jump across such a span is the dropped ticks. Shorter outages: parity (every tick flushed)"
  streams = ["telemetry", "state"]
  around_closed_ms = 5000
  min_span_ms = 1000000

  [[rule.row]]
  id = "end-snapshot"
  what = "RIG: state.json `latest` at the end — both agents get SIGTERM together, but their last ticks before it are up to one tick apart (different phases), so the final payload's values may be one sample apart; `seq` there is T2, `ts` T1. Every published payload is compared in the telemetry stream"
  streams = ["state"]
  paths = ["latest", "latest.**"]

  [[rule.row]]
  id = "mqtt-error-text"
  what = "MQTT/TLS transport error TEXT (wp1.md amb. #6; review-wp1 MUST-FIX #1 item 1; WP1 follow-up amb. 5): the state.json `error` events and `lastError` carry rumqttc/rustls text where mqtt.js/Node has its own (`read ECONNRESET`, `Client network socket disconnected …`), EXCEPT `Keepalive timeout` and `connack timeout`, which WP1 maps to the mqtt.js words and which must match exactly. Other error-level events that are not one of the agent's own wordings compare as one class `<transport error>` (present on both sides or neither); `lastError` likewise"
  streams = ["events", "state"]
  matcher = "transport_error_event"
  own_prefixes = ["publish error:", "config subscribe failed", "command subscribe failed", "unhandledRejection", "ledger write failed", "read error:", "upload failed"]
  exact_texts = ["Keepalive timeout", "connack timeout"]

  [[rule.row]]
  id = "reconnect-cadence"
  what = "reconnect cadence (review-wp1 MUST-FIX #1 item 2; WP1 follow-up amb. 3, 5): Rust backs off 1→60 s with jitter (xorgate-cloud mqtt.rs) where mqtt.js retries every 2 s (mqtt.ts:63 reconnectPeriod 2000), and detects a dead link at the 2nd unanswered ping (~2× keepalive) vs mqtt.js ~1.5×. So in a run with a closed span: the COUNTS of `reconnecting…`, `connection closed`, `connected to …` and transport-error events differ; a telemetry/status message inside the span (extended to both reconnects) ±5 s may be unpaired (a QoS 0 tick racing the drop is lost by Rust, written to the dying socket by mqtt.js); `published`/`publishErrors` may differ by 1 per closed span + 1 (the SIGTERM race at the end)"
  streams = ["events", "telemetry", "status", "state"]
  matcher = "reconnect_cadence"
  around_closed_ms = 5000
  event_exact = ["warn: reconnecting…", "warn: connection closed"]
  event_prefixes = ["info: connected to ", "error: <transport error>"]
  count_paths = ["published", "publishErrors"]

  [[rule.row]]
  id = "subscribe-fail-order"
  what = "a subscribe still awaiting its SUBACK at a drop fails once with `Connection closed` (mqtt.js _flushVolatile, client.js:794-803); Rust reports it just BEFORE the error/close events, the TS between `error` and `close` (WP1 follow-up amb. 4). The events stream is compared as a multiset, so the order never shows; counts must match"
  matcher = "doc_only"

  [[rule.row]]
  id = "disconnect-codec"
  what = "rumqttc 0.25.1 rejects the spec-legal reason-code-only DISCONNECT (remaining length 1) with `bytes remaining on stream`: a broker DISCONNECT of that form shows as an `error` (<transport error>) + `connection closed` on the Rust side where mqtt.js logs the disconnect + close (WP1 follow-up amb. 6). Mosquitto in the rig does not send it; whether AWS IoT Core does is unverified (bench capture). A mismatch of this shape on a bench tape is reported UNTOLERATED and is judged against this row by hand"
  matcher = "doc_only"

  [[rule.row]]
  id = "tick-drift"
  what = "FLAG (rig, reviewer to confirm; A2): Node's setInterval re-arms after each callback and drifts a few ms per tick, tokio's interval keeps its phase, so the two agents' tick phases slide past each other; when the pair gap exceeds 800 ms the hold gate flips roles and logs ONE lead tick as `skip` (pairs.ndjson). That tick's message is unpaired (within ±400 ms of the logged tick) and not value-compared; the values of every paired tick still are"
  streams = ["telemetry"]

  [[rule.row]]
  id = "fs-error-text"
  what = "failed atomic-write error TEXT (review-wp3 T8 item 1): the TS names the temp file and the failing syscall (`EACCES: permission denied, open '<dir>/.settings.json.tmp.<pid>.<n>'`, or `rename '…' -> '…'`), Rust the final path with `open`. Reaches state.json (warn) via `cloud config apply failed: …` (worker.ts:892) and `uploadBucket persist failed: …` (worker.ts:806) only on a failed write. Compared after replacing `, <syscall> '<path>'…` by `, <fs-op> '<path>'`; the code and text before it must match"
  streams = ["events"]
  event_prefixes = ["cloud config apply failed: ", "uploadBucket persist failed: "]

  [[rule.row]]
  id = "rust-only-events"
  what = "Rust-only event `config report failed: …` (review-wp3 T8 item 2): emitted on `PublishFailure::Failed` (the report publish could not be queued); the TS wording exists (config-sync.ts:1567, a thrown publish) but mqtt.js queues offline and never reaches it in that case. Tolerated only when present on the Rust side and absent on the JS side"
  streams = ["events"]
  event_prefixes = ["config report failed: "]

  [[rule.row]]
  id = "write-error-survival"
  what = "state.json / pidfile write errors (wp1.md amb. #11; review-wp1 MUST-FIX #1 item 4): the TS throws from a timer and the process dies, Rust logs `[agent] state.json write failed: …` / `pidfile write failed` and continues. Consumer-invisible; not reachable in the rig unless the home is made unwritable — a JS crash with such a write error ends its streams (the diff then lists every later message as unpaired)"
  matcher = "doc_only"

  [[rule.row]]
  id = "task-prefix"
  what = "panics in supervised tasks are reported like unhandledRejection with an extra `<task>:` segment (wp1.md amb. #15; review-wp1 MUST-FIX #1 item 5): Rust `unhandledRejection: <task>: <msg>` vs TS `unhandledRejection: <msg>` (worker.ts:656-662) — the Rust side's `<task>: ` is stripped before comparing"
  streams = ["events", "state"]
  matcher = "task_prefix"

  [[rule.row]]
  id = "s3-error-text"
  what = "PENDING Phase 3 (CF32, review-wp5 MUST-FIX 1): S3 / IoT-creds transport error TEXT (s3.rs:381-393, iot_creds.rs:252-316 vs node) reaches state.json via `upload failed, retrying in Ns: <msg>` (uploader.ts:203 → manager.ts:265 → worker.ts:488-492) once the uploader is wired; the suffix after the prefix is not compared for non-HTTP failures. Not reachable in Phase 2 (recording off)"
  streams = ["events"]
  matcher = "suffix_after_prefix"
  event_prefixes = ["upload failed, retrying in "]

[[rule]]
id = "T9"
title = "NO numeric-format tolerance: numbers are compared as their JSON text (1 vs 1.0 is a FAIL)"
basis = "phase file T9"
kind = "strict_numbers"
