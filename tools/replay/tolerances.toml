  streams = ["telemetry"]
  matcher = "null_leaf_group"
  pinned_by = "review-wp2 #6 (documented only; accepted-divergences.md D22)"

  [[rule.row]]
  id = "D23"
  what = "TS drops the FIRST NMEA chunk after a watchdog reopen (REOPEN_SILENT_MS silence): hardware/gps.ts:79 `stream.destroy()` leaves the old fs.ReadStream's in-flight libuv read on the old fd, that zombie read wins the first chunk after NMEA resumes and the destroyed stream discards it; the new stream starts at the second chunk. Rust (xorgate-hal nmea_tty.rs, 250 ms poll slice re-checks stop) drops the old fd and keeps the chunk — Rust matches the input. Matched ONLY: the JS side (A or B with kind js, the other rust); ONLY the first JS telemetry tick at/after each resume (from the tape); ONLY the metrics.gps fields the swallowed sentences set (GGA → fix_quality/satellites/alt/lat/lon/ttff_s; RMC → lat/lon/speed/course; GSA → hdop; GSV → satellites_in_view/sats_heard/snr_max/sky_state; a GGA quality 0 / void RMC also clears lat/lon/alt/speed/course/hdop) of the sentences in that first chunk. T4 does not apply to those gps fields at that tick. Accepted by the orchestrator 2026-10-10 (review-wp7 finding 1, resolution a)"
  streams = ["telemetry"]
  matcher = "nmea_reopen_first_chunk"
  pinned_by = "review-wp7 finding 1 (Node 20 experiment 3/3; accepted-divergences.md D23)"

  [[rule.row]]
  id = "D24"
  what = "telemetry segment gzip BYTES: TS zlib (gzipSync, level 6, mtime 0, OS 3) vs Rust flate2 at the same level and header fields — the deflate stream may differ; the DECOMPRESSED bytes are identical and the backend reads only those (P6). The rig never compares gz bytes (rec-telemetry / s3 compare decompressed text; T13)"
  streams = ["rec-telemetry", "s3"]
  matcher = "doc_only"
  pinned_by = "WP2 gzip finalize test (decompressed bytes equal the TS fixture); phase-3 P6"

  [[rule.row]]
  id = "D25"
  what = "default media paths: with KVS_RUNTIME_BIN / KVS_RUNTIME_LIB_DIR / KVS_CACERT_PATH unset the TS defaults are /opt/xorgate/media/…, the Rust agent's resolve under its install root (/opt/xorgate-rs/media/…, like XORGATE_PYTHON_DIR); every env key is honoured identically and no wire/file shape changes (P4). The rig always sets the knobs, so it never shows"
  streams = ["children"]
  matcher = "doc_only"
  pinned_by = "WP5 MediaConfig::from_env default-path test; phase-3 P4"

  [[rule.row]]
  id = "D30"
  what = "which consumer recomputes the shared 1 s system.sample() cache (TS: random — Node re-arms a repeat from the ms-floored libuv time and system.ts:107 sets recLastAt before the await; Rust: the first-armed shed tick, deterministically) → a JS recorder sample may lack `system`; a Rust one only under scheduler starvation (review-wp6 M2: the gate is stamped at the call). Matched JS-vs-Rust per telemetry session, `(samples without system)` with the Rust count 0 and the JS count ≥ 1 (either column order; no JS cap) — where a Rust system-less sample counts UNLESS it carries the starvation SIGNATURE (isolated: both neighbours carry `system`; taken 900–999 ms after the previous sample by `mono` — impossible on a steady host, whose fires are ≥ 1000 ms apart; such samples are cited D30 one by one as `(starved system-less samples …)`, any Rust-vs-X pair). Any other Rust drop is UNTOLERATED (evidence against D30). Never a count rule. JS-vs-JS stays T13/system-presence; Rust-vs-Rust exact. Orchestrator 2026-10-19 (P-WP6-2, review-wp6 §2-§3)"
  streams = ["rec-telemetry"]
  matcher = "d30_system_presence"
  pinned_by = "D30 (accepted-divergences.md); media_diff::tests::rec_telemetry_system_presence_per_sample + d30_starved_drop_signature_only; timer.rs re_arms_from_the_fire_instant…; tests/collectors.rs concurrent + d30_a_starved_recorder_sample_drops_system_once"

  [[rule.row]]
  id = "D30"
  what = "the same D30 cache ownership seen on a power-shed restore: a stale JS shed read lands the restore transition one tick LATER, so the restored video session starts ~1 s later on the JS side and its LAST fragment (cut by the same SIGTERM on both sides) is ~1 s shorter. Matched ONLY sidecar `durationMs` of a fragment that (a) is the LAST seq of its session on BOTH sides, whose capture child ended at the agent's stop (int/eos, no respawn); (b) δ = first-fragment startTs JS − Rust in [850, 1150] ms (JS later; JS-vs-JS |δ| in that band; never Rust-vs-Rust); (c) end instants (startTs + durationMs) agree within T12's 150 ms; (d) on each side the session's capture spawn lags that side's last telemetry recording.powerShed/liveBlock change by the same ±300 ms; (e) every earlier fragment of the session passed T12. NOT covered: a shed-event text difference, a T10 spawn instant past ±1 s. Orchestrator 2026-10-19 (P-WP6-2, review-wp6 §3; covers replay-20261019T152309Z cam1#1/00006 3451/4350)"
  streams = ["sidecar"]
  matcher = "d30_shed_tick_session_end"
  pinned_by = "D30 (accepted-divergences.md); media_diff::tests::d30_shed_tick_session_end_only_for_a_late_js_restore"

[[rule]]
id = "T8"
title = "Phase 2 orchestrator decisions"
basis = "phase file T8; O2, O3, O4; WP1 brief (publish while disconnected); README §6 (build identity)"
kind = "decisions"

  [[rule.row]]
  id = "O2"
  what = "O2 mono-vs-wall intervals — the five the TS measures on Date.now(): the gps reopen watchdog (30 s), NMEA freshness (10 s), TTFF, the gnss-sky.json 15 s cadence, the refresh 30 s window — PLUS WP2's lte/system `sample()` 1 s cache gates (collectors/lte.ts, system.ts:94-114), all on mono in Rust. Values are identical unless the wall clock steps: tolerated only within a window around a tape `clock` event that shows a wall step"
  matcher = "wall_step_window"
  # NARROWED (review-wp7): only the six mono-derived observables.
  # NARROWED (re-review R7): of the acks only the refresh 30 s window's
  # decision — `status`/`reason` of a `refresh` ack that is `rate-limited` on
  # at least one side.
  observables = [
    "telemetry:metrics.gps", "telemetry:metrics.gps.**",
    "file:gnss-sky.json:timestamp", "file:gnss-sky.json:hold_s",
    "ack:status", "ack:reason",
    "telemetry:metrics.lte", "telemetry:metrics.lte.**",
    "telemetry:metrics.system", "telemetry:metrics.system.**",
  ]

  [[rule.row]]
  id = "sim-mode-telemetry"
  what = "O7 (orchestrator 2026-10-10, wp7-fix-cov sms-sim scenario): with MODE=sim on the tape (meta.env.MODE) each agent's telemetry is its own simulator — the TS generator vs the Rust empty SimSource (O7: sim runs with collectors off) — so the telemetry stream is NOT compared for that tape (diff.md says so; telemetry compared = 0). Every other stream (sms, acks, reports, status, events, files) is compared as usual"
  streams = ["telemetry"]
  matcher = "sim_mode"

  [[rule.row]]
  id = "O3"
  what = "`update` sudo argv names xorgate-updater-rs.service"
  streams = ["sudo"]
  normalize = { "xorgate-updater-rs.service" = "xorgate-updater.service" }

  [[rule.row]]
  id = "sms-duration"
  what = "read_sms `durationMs` is a measured wall span of the sweep (TS sms-modem.ts:504-519 `end - start`; Rust command_flow.rs, monotonic, series-5 item 2): two agents' sweeps take 0-2 ms each (JS-vs-JS spread over every series-1..4 run: max 2 ms of 18 pairs). Matched ONLY on `…/sms` `durationMs` and the `durationMs=<n>` of the `read_sms <id>:` event line (paired per request id), ONLY when BOTH values are non-negative integers differing by at most max_delta_ms; nothing else in the payload"
  streams = ["sms", "events"]
  matcher = "sms_duration_ms"
  max_delta_ms = 50

  [[rule.row]]
  id = "pidfile"
  what = "pidfile worker / argv / nodeVersion (CF4)"
  streams = ["pidfile"]
  paths = ["worker", "argv", "argv.**", "nodeVersion"]

  [[rule.row]]
  id = "writtenBy"
  what = "state.json writtenBy"
  streams = ["state"]
  paths = ["writtenBy"]

  [[rule.row]]
  id = "build"
  what = "the agent's own build identity in the report (README §6, Q7: each agent reports its own build)"
  streams = ["report"]
  # NARROWED (review-wp7): the key set and order of `build` are compared; only
  # the four leaf VALUES are each agent's own.
  paths = ["effective.agent.build.version", "effective.agent.build.channel", "effective.agent.build.builtAt", "effective.agent.build.packageVersion"]
  values_only = true

  [[rule.row]]
  id = "cli-banner"
  what = "build identity + usage (README §6, Q7; WP6 A5; review-wp6 item 2 — NOT D20, which is the build-info fallback channel): `-v` prints `xorgate-rs <build>` vs `xorgate <ver>` (version.rs:1-15 vs cli.tsx:24-26,64-67); `help` / no verb / an unknown verb print the Rust usage (cli.rs usage(): this binary's verbs, the systemd hint for start/stop/restart, `manage` without daemon control — Q10/D35) vs cli.tsx's. C11: stdout differs; exit code and stderr must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-systemd-verbs"
  what = "`start` / `stop` / `restart` (WP6 A5; README §3.3 drops the self-managed daemon): Rust prints `xorgate-rs: '<verb>' is systemd's job for the Rust agent: sudo systemctl <verb> xorgate-agent-rs` and exits 1 (cli.rs) where the TS manages its detached worker (manager.ts start/stop/restart). C11: stdout/stderr/exit differ; settings.json must match"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-q9-names"
  what = "MAPPING row (cli-matrix.sh `map:`), not a free pass: Q9 local-only CLI hints name the Rust binary — `[xorgate-rs] update failed: … sudo xorgate-rs update` (D-WP4-6), the `xorgate-rs led` usage block + `'xorgate-rs led off'` (WP1 Q9 strings), `xorgate-rs sms` help (D34). The Rust side's `xorgate-rs` → `xorgate`, then stdout/stderr/exit/settings.json must be identical"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-sms-duration"
  what = "MAPPING row: `xorgate-rs sms` prints the sweep's own duration (`· <N> ms`), a timing — normalised on both sides, everything else identical (the T8/sms-duration rule of the …/sms payload, for the CLI)"
  streams = ["cli"]

  [[rule.row]]
  id = "cli-tui-no-tty"
  what = "`manage` / `monitor` without a terminal (the matrix runs with stdin </dev/null): ink renders its first frame then fails `Raw mode is not supported…` (exit 1) where crossterm fails `No such device or address (os error 6)` (exit 1) before drawing. The TUI itself is compared on ratatui TestBackend frames vs the TS monitor.test.tsx its (D35, tests/manage_tui.rs) and on the bench over `ssh -t` (E15); exit code and settings.json must match"
  streams = ["cli"]

  [[rule.row]]
  id = "logs-journal"
  what = "O9: with no $XORGATE_HOME/agent.log the Rust `logs` execs `journalctl -u xorgate-agent-rs -n N` (logs.rs:59-72) where the TS prints the empty-log text (logs.ts). C11: stdout/stderr/exit differ when the home has no agent.log; with an agent.log both must match"
  streams = ["cli"]

  [[rule.row]]
  id = "set-mode-running"
  what = "WP6 A3: `set mode <m>` while an agent is running — the TS restarts its self-managed daemon (set.ts:515-530: stop + start with the pidfile argv), Rust (systemd only, README §3.3) prints `could not restart automatically: …` + the `sudo systemctl restart xorgate-agent-rs` hint and exits 1 (cli_set.rs:54-63), the shape of the TS failure branch :527-529. C11: stdout/stderr/exit differ; settings.json must be identical"
  streams = ["cli"]

  [[rule.row]]
  id = "rig-cut-ungated"
  what = "RIG limitation, NARROWED per review-wp7 finding 4: while the broker path is cut the hold gate cannot observe ticks (publishes are queued), so inputs are released ungated and the fallback pairing keeps the pre-cut offset. Inside a closed span (extended until BOTH agents publish again) ±5 s the diff therefore RE-PAIRS the telemetry with the alignment (current partner, or one tick earlier/later) chosen by TIMING, never by content (re-review R4): the fewest input bursts released between the two reads (releases.ndjson), then the nearest ts — then compares STRICTLY: no presence tolerance, no gps/lte/system value tolerance. The only residual: a VALUE inside the span whose group's input the tape released BETWEEN the two agents' reads (the gate cannot hold releases while an agent's ticks are unobserved — still the case until BOTH reconnect): metrics.imu.* ← an IMU line (−1 s), metrics.lte.* ← an LTE-file change, metrics.system.* ← an exec/dt change, and for lte/system ONLY a field that change moved, as an old/new split on BOTH sides in one direction (re-review R4: A_k = B_k−1 and B_k = A_k+1, or the mirror; a field equal in both versions, or frozen on one side, never matches); never gps (continuous NMEA, aligned by the re-pair). A re-pair run may orphan at most 2 ticks (judged as this row; listed with the moves in diff.md); otherwise ONE unpaired tick per side and span is reconnect-cadence. Replaces the earlier `cadence` row: publishing while disconnected is now parity (WP1 follow-up; Phase 0 deviation #8 gone)"
  streams = ["telemetry", "status"]
  around_closed_ms = 5000

  [[rule.row]]
  id = "offline-queue-bound"
  what = "offline queue bound (WP1 follow-up amb. 1): Rust caps the QoS 1 store and the QoS 0 queue at 1000 each, oldest dropped (xorgate-cloud mqtt.rs OFFLINE_QUEUE_LIMIT); mqtt.js is unbounded (client.js:1081-1096). Past ~16.7 min of outage at 1 Hz the TS flushes more stale telemetry and counts more `published`; a Rust seq jump across such a span is the dropped ticks. Shorter outages: parity (every tick flushed)"
  streams = ["telemetry", "state"]
  around_closed_ms = 5000
  min_span_ms = 1000000

  [[rule.row]]
  id = "input-edge"
  what = "NARROWED per review-wp7 (JS-lag only): within ±1.5 s of an NMEA transition (gps group: stream start/stop/stale/resume, GGA quality change) or a GSV satellites-in-view change, a metrics.gps.* value where the JS agent reads Rust's PREVIOUS sample and the JS NEXT sample equals Rust's value — the line reached Node's read a tick later; a Rust value one tick late is NOT covered; at most 2 ticks per 10 min. Cause: the TS handles NMEA per CHUNK on the event loop (hardware/gps.ts:61-74, fs.ReadStream through the libuv threadpool) and lagged a released line by 0.15–0.4 s in the loaded VM, where Rust's reader thread forwards it at once. Seen 1–2× per 10 min JS-vs-Rust (fix_quality on a 13 ms pair after an NMEA restart; sky_state, whose change is a hold timer measured from GSV ARRIVAL, sky_state.rs / gps.ts), never JS-vs-JS. A value that matches neither neighbour stays UNTOLERATED"
  streams = ["telemetry"]
  around_closed_ms = 1500
  # NARROWED (review-wp7): JS-LAG only — the JS value is Rust's PREVIOUS sample
  # and the JS NEXT sample is Rust's value (a Rust value one tick late fails);
  # only metrics.gps.* within ±1.5 s of an NMEA transition (gps group) or a GSV
  # satellites-in-view change; at most 2 ticks per 10 min, else all UNTOLERATED.
  max_hits_per_10min = 2

  [[rule.row]]
  id = "ttff-arrival"
  what = "NARROWED to ±0.1 s (review-wp7). `ttff_s` is the difference of two NMEA line ARRIVAL instants inside each process (first quality-0 GGA → first fix, gps.ts:139-151 / gps_group.rs TtffClock, identical logic). The player writes each line to both ptys at once, but Node handles a pty chunk when its event loop gets to it (fs.ReadStream reads through the libuv threadpool; 0.4–1.5 s tick stalls were seen in the loaded Docker VM) while Rust's reader thread forwards it at once; quantised to 0.1 s (round(t,1)) this flips by one step (149.1 vs 149, JS-vs-Rust; JS-vs-JS identical). Tolerated: ±0.1 s (one quantum) on `metrics.gps.ttff_s.value` only"
  streams = ["telemetry"]
  # NARROWED (review-wp7): one 0.1 s quantum.
  numeric = { "metrics.gps.ttff_s.value" = 0.1 }

  [[rule.row]]
  id = "sky-file-end"
  what = "RIG: gnss-sky.json at the end is each agent's LAST 15 s write (gps.ts:232-258 SKY_PUBLISH_MS) at its own instant (`timestamp`); `hold_s` is the state's age at that write, so with the SAME `state` it may differ by the distance between the two writes' `timestamp`s (rounded up) + 1 s truncation; every other key of the file is compared"
  streams = ["file:gnss-sky.json"]

  [[rule.row]]
  id = "d30-js-reference"
  what = "CALIBRATION ONLY (JS-vs-JS): D30 inside the reference — a JS shed tick deciding on its recorder's ≤ 1 s old cached power reading (TS system.ts:104-113 + Node setInterval re-arm), so one JS logs the previous rail value and its restore lands one shed tick later. Matchers (media_diff.rs, HARD GUARD in code: both return false unless BOTH sides are js; nothing here can widen them): `d30_js_shed_text` — exactly one A+1 and one B+1 `power shed → …(rail <V>V < …)` message, identical with V masked, the two V consecutive distinct values of the tape's released pmic series, the stale side's event in [release of the fresher value, +1100 ms], one pair per masked template; `d30_js_spawn_tick` — kvs `(spawn ms after start)` only, 1000 < |Δ| ≤ 1150, each side's spawn lagging its own last powerShed/liveBlock change by the same ±300 ms, every kvs spawn of that restore shifted by the same Δ ±150, at most channels × shed changes rows. JS-vs-Rust / Rust-vs-JS / Rust-vs-Rust: the same rows stay UNTOLERATED (Rust is never stale). Orchestrator 2026-10-19 (replay-20261019T173537Z)"
  streams = ["events", "children"]
  matcher = "d30_js_shed_text"
  pinned_by = "D30 (accepted-divergences.md); review-wp6 re-check; media_diff::tests::d30_js_reference_only_for_js_vs_js"

  [[rule.row]]
  id = "d30-js-late-shed"
  what = "D30 (accepted-divergences.md) as seen JS-vs-Rust, orchestrator option (b) 2026-10-19: at a power crossing the JS shed tick may REUSE its recorder's ≤ 1 s old reading (TS system.ts:104-113, Node setInterval re-arm), so ONE shed/restore transition lands one shed period LATER on the JS side; Rust never reuses (collectors/system.rs:61-79). Matcher `d30_js_late_shed` (media_diff.rs; HARD GUARD in code: JS-vs-Rust with the JS side later, or JS-vs-JS with either side later — the later side must be JS and carry the evidence itself; review-wp6 re-check extension 2026-10-19): per transition Δ = JS − Rust ∈ [850, 1150] ms AND evidence of stale reuse from the tape's released vcgencmd values + the JS recorder's own samples (a release before the decisive tick that its previous sample lacked and its next carried), or the next transition of the same chain shifted by the same Δ ±150; then ONLY that transition's downstream rows — kvs/capture spawn instants within 6 s after it, sidecar durationMs of the session it started (JS shorter by Δ) or of a fragment ending at it (JS longer by Δ), and the startTs/startMono of the fragment that STARTS at it (orchestrator 2026-10-19) — by the same Δ ±150; one shift per transition. Rust-later, |Δ| outside the band, missing evidence on the later side, and rust/rust: UNTOLERATED. (powerShed string instants are T4 transition, liveBlock.since T1)"
  streams = ["children", "sidecar"]
  matcher = "d30_js_late_shed"
  pinned_by = "D30 (accepted-divergences.md); media_diff::tests::d30_js_late_shed_only_js_later_with_evidence"

  [[rule.row]]
  id = "end-snapshot"
  what = "RIG: state.json `latest` at the end — both agents get SIGTERM together, but their last ticks before it are up to one tick apart (different phases), so the final payload's values may be one sample apart; `seq` there is T2, `ts` T1. Every published payload is compared in the telemetry stream"
  streams = ["state"]
  # NARROWED (review-wp7): no path exclusion. Each side's `latest` must EQUAL its
  # own last published telemetry payload (else UNTOLERATED); across agents the
  # key structure of `latest` is compared under the telemetry rules (T4/T6 …)
  # and only the VALUES are this row.
  matcher = "end_snapshot"
  # Phase 3: state.json's `recording` block is written at SHUTDOWN, racing the
  # last fragments' EOS + finalize (JS-vs-JS 1 vs 3). NARROWED (review-wp6
  # FLAG 3): NO cross-side bound — media_diff.rs checks each side's value
  # against [its own last tick − 1, the unuploaded pieces on its disk] and
  # only then cites this row for `recording.backlogSegments` (any Δ). Every
  # tick's `recording.backlogSegments` is still compared EXACTLY in telemetry.

  [[rule.row]]
  id = "mqtt-error-text"
  what = "MQTT/TLS transport error TEXT (wp1.md amb. #6; review-wp1 MUST-FIX #1 item 1; WP1 follow-up amb. 5): the state.json `error` events and `lastError` carry rumqttc/rustls text where mqtt.js/Node has its own (`read ECONNRESET`, `Client network socket disconnected …`), EXCEPT `Keepalive timeout` and `connack timeout`, which WP1 maps to the mqtt.js words and which must match exactly. Other error-level events that are not one of the agent's own wordings compare as one class `<transport error>` (present on both sides or neither); `lastError` likewise"
  streams = ["events", "state"]
  matcher = "transport_error_event"
  own_prefixes = ["publish error:", "config subscribe failed", "command subscribe failed", "unhandledRejection", "ledger write failed", "read error:", "upload failed"]
  exact_texts = ["Keepalive timeout", "connack timeout"]

  [[rule.row]]
  id = "reconnect-cadence"
  what = "reconnect phase (review-wp1 MUST-FIX #1 item 2; WP1 follow-up amb. 3, 5; rewritten by fix-timer-cadence): both agents retry a FIXED 2000 ms after every close, no growth, no jitter (mqtt.js 5.15.1 `_setupReconnect` with `reconnectPeriod: 2000`, mqtt.ts:63 ↔ xorgate-cloud backoff.rs `BackoffConfig::fixed` 2000 ms, mqtt.rs `pause_before_reconnect`), but each on its OWN phase (counted from its own close), so after a restore one can reconnect up to ~2 s before the other; and a black-holed link is detected at rumqttc's 2nd unanswered ping (~2× keepalive) vs mqtt.js ~1.5× (the rig's proxy closes the sockets, so not reached there). So in a run with a closed span: the COUNTS of `reconnecting…` / `connection closed` differ by at most ONE per closed span, EITHER way; the transport-error class count differs; a telemetry/status message inside the span (extended to both reconnects) ±5 s may be unpaired (a QoS 0 tick racing the drop is lost by Rust, written to the dying socket by mqtt.js); `published`/`publishErrors` may differ by 1 per closed span + 1 (the SIGTERM race at the end); the REPORT count of a quiet period overlapping the span may differ (each reconnect's retained redelivery triggers a `cloud` report, and the agent reconnecting first can see an intermediate retained rev the other never sees — the next quiet period's last report still binds both); and a report VALUE that an input fed differently because the input changed between the two agents' post-reconnect report times (a tape transition between them, report pair inside a cut's window — e.g. effective.sim.checked_at from the LTE file)"
  streams = ["events", "telemetry", "status", "state", "report"]
  matcher = "reconnect_cadence"
  around_closed_ms = 5000
  event_exact = ["warn: reconnecting…", "warn: connection closed"]
  # NARROWED (review-wp7; made symmetric by fix-timer-cadence): `connected to …`
  # is NOT here — each agent must log it exactly #closed spans + 1 times;
  # `reconnecting…` / `connection closed` only with |Δ| ≤ #closed spans (either
  # side may have the extra one: independent 2 s phases); the transport-error
  # class either way; an unpaired telemetry tick at most ONE per side and span;
  # the report COUNT of a period overlapping a span only as modelled (|Δ| ≤
  # spans it overlaps, every extra report origin `cloud` with a rev the tape
  # published); a report VALUE only on a path an LTE-file change between the
  # two reports feeds.
  event_prefixes = ["error: <transport error>"]
  count_paths = ["published", "publishErrors"]

  [[rule.row]]
  id = "subscribe-fail-order"
  what = "a subscribe still awaiting its SUBACK at a drop fails once with `Connection closed` (mqtt.js _flushVolatile, client.js:794-803); Rust reports it just BEFORE the error/close events, the TS between `error` and `close` (WP1 follow-up amb. 4). The events stream is compared as a multiset, so the order never shows; counts must match"
  matcher = "doc_only"

  [[rule.row]]
  id = "disconnect-codec"
  what = "rumqttc 0.25.1 and a broker DISCONNECT (WP1 follow-up amb. 6 as corrected by review-wp1-followup MUST-FIX #1): a reason-code-only DISCONNECT is SILENTLY SWALLOWED — the close that follows shows as close-only when the broker sends TLS close_notify and as an `error` (<transport error>) + close when it does not; a zero-length DISCONNECT `[E0 00]` yields `Payload is required`. mqtt.js logs the disconnect + close. Never a reconnect loop, never data loss. Not reachable with mosquitto in the rig; whether AWS IoT Core sends these forms is unverified (bench capture). A mismatch of this shape on a bench tape is reported UNTOLERATED and judged against this row by hand. (A TLS peer-close WITHOUT close_notify producing an extra `mqtt error` is NOT tolerated: phase-2/integration removes it)"
  matcher = "doc_only"

  [[rule.row]]
  id = "tick-drift"
  what = "FLAG (rig, reviewer to confirm; A2): each agent re-arms from its own fire and drifts by its own wake-up lateness (Node setInterval; Rust `timer::SetInterval` since fix-timer-cadence — was tokio's fixed-rate interval), so the two agents' tick phases slide past each other; when the pair gap exceeds the rig's flip gap (`--flip-gap-ms`, 500 ms since series 5 = the nearest alignment; was 800) the hold gate flips roles and logs ONE lead tick as `skip` (pairs.ndjson). That tick's message is unpaired (within ±400 ms of the logged tick) and not value-compared; the values of every paired tick still are. CAPPED (re-review R5): at most ceil(run_s × |P_A − P_B| / 1000) + 1 such ticks per run, from each side's own mean tick period P (the phases slide |ΔP| ms per tick; one flip per 1000 ms of slide), else every hit is UNTOLERATED — JS-vs-JS (15 runs, series 4/5): |ΔP| ≤ 1.13 ms → cap 2 per 260 s, 0 skips observed (the pre-hysteresis 195214Z flapping, 25 skips, would fail). CADENCE (re-review R5): each agent re-arms its 1 s tick from the fire time (Node setInterval `listOnTimeout`; Rust `xorgate-agent` timer.rs `SetInterval`, every tick since fix-timer-cadence), so its mean period is 1000 ms + its wake-up lateness — measured in the rig: JS 1003.4–1007.4 ms, Rust 1001.7–1005.0 ms; |ΔP| JS-vs-JS ≤ 1.13 ms, JS-vs-Rust ≤ 3.12 ms (33 runs); re-measured after fix-timer-cadence (8 Phase 3 JS-vs-Rust runs 2026-10-19): JS 1001.68–1003.77, Rust 1002.68–1003.53, |ΔP| ≤ 1.24 ms — bounds unchanged. Each mean must lie in period_ms and |ΔP| ≤ max_period_delta_ms; a 1 % period error (10 ms) fails both. A |ΔP| ≥ 0.5 ms inside the bounds is listed as this row"
  streams = ["telemetry"]
  period_ms = [999.5, 1010.0]
  max_period_delta_ms = 4.0

  [[rule.row]]
  id = "fs-error-text"
  what = "failed atomic-write error TEXT (review-wp3 T8 item 1, shrunk per phase-2/integration): both agents now name Node's step and the temp file (`open '<dir>/.settings.json.tmp.<pid>.<n>'`, `rename '<tmp>' -> '<dest>'`, pathless write/fsync); only the temp file's `<pid>.<n>` differs per process and is normalised. Reaches state.json (warn) via `cloud config apply failed: …` (worker.ts:892) and `uploadBucket persist failed: …` (worker.ts:806) only on a failed write; not reachable in the rig"
  streams = ["events"]
  event_prefixes = ["cloud config apply failed: ", "uploadBucket persist failed: "]

  [[rule.row]]
  id = "rust-only-events"
  what = "Rust-only event `config report failed: …` (review-wp3 T8 item 2): emitted on `PublishFailure::Failed` (the report publish could not be queued); the TS wording exists (config-sync.ts:1567, a thrown publish) but mqtt.js queues offline and never reaches it in that case. Tolerated only when present on the Rust side and absent on the JS side"
  streams = ["events"]
  event_prefixes = ["config report failed: "]

  [[rule.row]]
  id = "write-error-survival"
  what = "state.json / pidfile write errors (wp1.md amb. #11; review-wp1 MUST-FIX #1 item 4): the TS throws from a timer and the process dies, Rust logs `[agent] state.json write failed: …` / `pidfile write failed` and continues. Consumer-invisible; not reachable in the rig unless the home is made unwritable — a JS crash with such a write error ends its streams (the diff then lists every later message as unpaired)"
  matcher = "doc_only"

  [[rule.row]]
  id = "task-prefix"
  what = "panics in supervised tasks are reported like unhandledRejection with an extra `<task>:` segment (wp1.md amb. #15; review-wp1 MUST-FIX #1 item 5): Rust `unhandledRejection: <task>: <msg>` vs TS `unhandledRejection: <msg>` (worker.ts:656-662) — the Rust side's `<task>: ` is stripped before comparing"
  streams = ["events", "state"]
  matcher = "task_prefix"

  [[rule.row]]
  id = "s3-error-text"
  what = "CF32 (review-wp5 MUST-FIX 1), shrunk by WP6 to WP3's unmapped list (wp3.md CF32 mapping table, last row): the suffix of `upload failed, retrying in Ns: <msg>` (uploader.ts:203 → manager.ts:265 → worker.ts:488-492) is folded ONLY for webpki UnknownIssuer (node: self-signed / unable to get local issuer), a SAN mismatch (node embeds the altnames), a corrupt-but-present PEM block, a key/cert mismatch, and node 20's multi-address AggregateError (empty message) — node side `fold_texts`, Rust side the raw `error_chain` fallback. The agent's own texts (`own_prefixes`, the TS strings of s3-put.ts / iot-creds.ts) and every text WP3 maps to node wording (`mapped_prefixes`: s3.rs node_transport_error, iot_creds.rs node_pem_error) are compared exactly"
  streams = ["events"]
  matcher = "suffix_after_prefix"
  event_prefixes = ["upload failed, retrying in "]
  own_prefixes = [
    "S3 PUT failed: HTTP ",
    "S3 PUT timed out",
    "IoT credentials fetch failed: HTTP ",
    "IoT credentials fetch timed out",
    "IoT credentials response missing fields",
    "IoT credentials response unparseable: ",
  ]
  mapped_prefixes = [
    "getaddrinfo ",
    "connect E",
    "socket hang up",
    "read ECONNRESET",
    "write EPIPE",
    "Client network socket disconnected before secure TLS connection was established",
    "certificate has expired",
    "certificate is not yet valid",
    "error:0480006C:PEM routines::no start line",
    "error:1E08010C:DECODER routines::unsupported",
  ]
  fold_texts = [
    "self-signed certificate",
    "unable to get local issuer certificate",
    "unable to verify the first certificate",
    "Hostname/IP does not match certificate's altnames",
    "PEM routines::",
    "asn1 encoding routines::",
    "DECODER routines::",
    "x509 certificate routines::key values mismatch",
    "",
  ]

[[rule]]
id = "T9"
title = "NO numeric-format tolerance: numbers are compared as their JSON text (1 vs 1.0 is a FAIL)"
basis = "phase file T9"
kind = "strict_numbers"

# ---------------------------------------------------------------- Phase 3
# T10–T14: phase-3-recording-media.md §Record/replay "What is compared, and
# how" (read by media_diff.rs; `tolerance` = the ± bounds in ms / counts).

[[rule]]
id = "T10"
title = "child spawn instants ±1 s (argv/env/signals/ended exact; stagger gap ≥ cfg per side); a kvs master SIGINT-stopped within flashMs of its spawn (the capture-spawn bounce racing the master's restart) may be absent on the other side — NARROWED (review-wp6): only when a capture of the SAME camera (the master's KVS_GST_PIPELINE camN) spawned within ±flashMs on that side, one flash per capture spawn"
basis = "phase file T10; flash: worker.ts:455 onCaptureSpawned → media.ts:51-59 restartChannel racing setDisabledCameras' release inside ONE agent (WP6 calibration rec-cameras JS-vs-JS: 4 vs 3 kvs cam1 spawns, the extra one stopped in the same ms); flashes are dropped from both sides only when that equalises the counts"
kind = "media"
streams = ["children"]
tolerance = { "spawnMs" = 1000.0, "flashMs" = 100.0 }

[[rule]]
id = "T11"
title = "session identity + anchor: sessionId, bootId, anchorTs, anchorMono"
basis = "phase file T11"
kind = "exclude"
streams = ["session", "rec-telemetry"]
paths = ["sessionId", "bootId", "anchorTs", "anchorMono"]

[[rule]]
id = "T11"
title = "the payload's recording.sessionId (the telemetry session uuid, minted per agent like T11's session ids)"
basis = "phase file T11 (session ids are per-instance); phase file table row `payload media/recording blocks`"
kind = "exclude"
streams = ["telemetry", "state", "report"]
paths = ["recording.sessionId", "latest.recording.sessionId", "**.recording.sessionId"]

[[rule]]
id = "T12"
title = "sidecar timing: startTs ±300 ms vs the agent's own capture PLAYING time, startMono (within the session) ±300 ms, durationMs ±150 ms, sizeBytes any; mp4 count per session ±1 (the run's cut)"
basis = "phase file T12"
kind = "media"
streams = ["sidecar", "mp4"]
tolerance = { "startTs" = 300.0, "startMono" = 300.0, "durationMs" = 150.0 }
paths = ["sizeBytes"]

[[rule]]
id = "T12/cut-fragment"
title = "sidecar `durationMs` of a session's CUT fragment (its last, ended by the agent's stop): compared by its END instant `startTs + durationMs` (±endMs), not by its duration — conditions = d30_session_end (a)+(c)+(d) without (b): last seq on BOTH sides + capture ended at the stop, never respawned; end instants within endMs; each side's session start is anchored to ITS OWN shed transition: the spawn-minus-last-powerShed/liveBlock-change lags of the two sides differ by ≤ tickMs (decision → spawn is one code path; the change is seen on each side's next 1 s publish tick, worker.ts:1207), or neither side had one (boot-started). Every other fragment keeps T12's ±150 ms (GOP boundaries at both ends)"
basis = "review-wp6 M3 (F1): a cut fragment's duration = stop − session start; the stop is one instant for both agents (the player SIGTERMs both together, play.rs) and the session start follows each agent's own phase — boot skew, or the shed tick (manager.ts:612-615) for a transition-started session — which T12 never bounded (replay-20261019T231240Z 7066/6895, review run 3 5191/5388 in plain `media`). The end instant carries the stop jitter only (T12's 150 ms); the start is judged by startTs-vs-PLAYING (T12) and the T4 transition rule"
kind = "media"
streams = ["sidecar"]
tolerance = { "endMs" = 150.0, "tickMs" = 1100.0 }

[[rule]]
id = "T13"
title = "telemetry segments: file-name ms stamps and rotation count ±1; gz bytes never compared (D24)"
basis = "phase file T13; P6"
kind = "media"
streams = ["rec-telemetry"]

[[rule]]
id = "T13/system-presence"
title = "telemetry segments, JS-vs-JS pairs ONLY (calibration): per telemetry session, the number of samples WITHOUT the agent-sampled `system` group may differ by perSession (5, the review limit; observed JS-vs-JS per-instance spread 0–4, the TS D30 drops). JS-vs-Rust → T7/D30 (d30_system_presence: Rust 0 bar the starvation signature); Rust-vs-Rust exact bar that signature"
basis = "WP6 2026-10-19 (the per-segment group union hid a recorder that drops `system` on 6-8 % of ticks). TS: system.ts:104-113 recomputes the recorder-side cache at most once per 1000 ms (Date.now gate) and telemetry-recorder.ts:102 skips a group whose updatedMono did not advance, so a tick landing under 1000 ms after the last recompute writes no `system` — 0-5 per run under Node setInterval. JS-vs-JS calibrations (replay-20261017T221027Z … T224409Z + replay-20261019T140703Z, 10 runs): max |Δ| per session = 2 (JS-vs-Rust 2026-10-19: 5-16)"
kind = "media"
streams = ["rec-telemetry"]
# Raised 2 → 5 (orchestrator 2026-10-19, the review's limit): JS-vs-JS
# per-instance spread observed 0–4 (replay-20261019T201533Z: A 4 / B 0, the
# D30 drops of one JS instance). JS-vs-Rust is d30_system_presence (Rust 0).
tolerance = { "perSession" = 5.0 }

[[rule]]
id = "T4/rec-sample"
title = "recorded telemetry VALUES (review-wp6 G1): per telemetry session and leaf (not T3's host-read paths), the run-length-deduplicated value sequences over the segments both sides hold are compared EXACTLY; one step carried by ONE sample may be absent on the other side only at a segment-stretch edge (±1 sample) or (NARROWED, review-wp6 re-check) where the OTHER side's sample nearest THE release that brought the step (the group's last input burst — releases ≤ 200 ms apart, an NMEA epoch spans ~60 ms — starting ≤ the step's sample and ≤ 1.1 s before it) lies within collisionMs of that burst (its tick raced that input); a hunk of ≥ 2 missing steps is never a race. ADDED (review-wp6 F4): a gps hunk where A holds ONE step (one sample) and B holds ONE other step (one sample) is two adjacent MISSES, one per side, only when content proves it and each miss passes the race test on its own: each side's NMEA lines (its agent tape at its own read instants; the player's releases for a JS side) are replayed through the agent's own core (FixAggregator + SkyTracker → map_latest, collectors/gps.rs), the two values are CONSECUTIVE values of that leaf in the same order on both sides, each holder's value became current on its side ≤ 1.1 s before its sample, and each lacking side's sample nearest the instant ITS missing value became current on THAT side lies within collisionMs; and (S-F4, re-review) every instant used is a Rust read within collisionMs of the player's release of the SAME line as written (the race window itself; measured max 14 ms under 15 busy loops) (releases.ndjson; the read path pty → tty thread → channel → run_stream stamp, gps.rs:251) — the anchor is never purely self-reported; anything else two-sided (a value the replay never produced, non-consecutive values, no race at either miss, no reads) stays UNTOLERATED. Per group (not system), the count of samples carrying it may differ by the group's T4 input transitions in the stretch (cited T4)"
basis = "phase file row `telemetry segments … sample metrics per T3/T4`; the recorder ticks on its own timer, ungated by the player (telemetry-recorder.ts:67-72 ↔ recording/telemetry.rs), so a 1 Hz input released within a few ms of a recorder tick lands on that tick or the next. WP6 2026-10-19 runs: JS-vs-JS 8/8 exact; JS-vs-Rust media/rec-shed-uv/rec-cameras each skip 1-2 NMEA steps where that side's tick fell 1-5 ms from the burst release (e.g. replay-20261019T151749Z Rust tick 29.655 vs burst 29.654). F4 (review-wp6 heavy run 1, 15 busy loops; WP6 gate run 033610Z): the recorder tick drifts (setInterval re-armed from each fire, telemetry-recorder.ts:67-72; mean 1003 ms under load) and its ts is stamped after the collectors are read (:90-125), so while its phase crosses the input's phase every sample is a coin flip per side: A ticking just before its read of epoch k+1 and B just after (same slot, both stamped 1792550521989) gives A: P X · N and B: P · Y N, which LCS shows as the substitution X/Y (lat/lon/alt 14.502373/14.502382 = consecutive fixes); likewise snr_max 32/31 (033610Z: becomes current at the GPGSV cycle's last line; B ticked 1 ms before it, A read 26 ms before its stamp). A step present on BOTH sides as values no adjacent epoch pair explains is never tolerated"
kind = "media"
streams = ["rec-telemetry"]
tolerance = { "collisionMs" = 50.0 }

[[rule]]
id = "T12/interior-boundaries"
title = "INTERIOR video fragment (its successor exists on both sides): durationMs is judged as the difference of its two boundaries — its END (startTs + durationMs) relative to each side's own capture PLAYING within T12's startTs bound, like its start (row T12); the session's last fragment keeps T12 / T12/cut-fragment"
basis = "video-segments.ts:173-182: for seq ≥ 1 startTs = the mp4's birthtime (the file splitmuxsink opens at the rotation) and durationMs = mtime − birthtime (its last write at finalize), so an interior fragment's end is the next fragment's start (per side: end − next startTs within ±3 ms, gate run 035741Z) — two fs instants of each agent's own gst process. T12's durationMs ±150 is inconsistent with its own startTs ±300 once each encoder is starved independently: re-review run rr-m1 (15 busy loops + host overload) moved one interior boundary 272 ms (cam0#0/00003 startTs 409233 vs 409505) while the neighbour compensated (00002+00003 = 19998 vs 19839; 00004 starts ±30) — durations 8377 vs 8075. No new number: the end boundary gets the start boundary's bound. Plus, per side, the fragment's end must meet its OWN successor's startTs within FRAGMENT_SEAM_MS 50 (media_diff.rs; measured −42…0 ms over 240 seams under 15 busy loops), so a late finalize cannot pass inside ±300"
kind = "media"
streams = ["sidecar"]

[[rule]]
id = "T14"
title = "S3 PUT timing / failed-attempt counts (NARROWED review-wp6: |Δ| ≤ 1 per meta.rig.s3Faults window edge, exact without faults), and a session's LAST fragment or LAST telemetry segment (newest seq of that session on either side, and the side without the PUT holds it or never got that far) present on one side only — never a middle segment; telemetry bodies compared decompressed (rec-telemetry), mp4 body hash not compared"
basis = "phase file T14"
kind = "media"
streams = ["s3"]

