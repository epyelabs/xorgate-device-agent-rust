[[rule]]
id = "T12/cut-fragment"
title = "sidecar `durationMs` of a session's CUT fragment (its last, ended by the agent's stop): compared by its END instant `startTs + durationMs` (±endMs), not by its duration — conditions = d30_session_end (a)+(c)+(d) without (b): last seq on BOTH sides + capture ended at the stop, never respawned; end instants within endMs; each side's session start is anchored to ITS OWN shed transition: the spawn-minus-last-powerShed/liveBlock-change lags of the two sides differ by ≤ tickMs (decision → spawn is one code path; the change is seen on each side's next 1 s publish tick, worker.ts:1207), or neither side had one (boot-started). SCOPE EXTENDED (Phase 5b WP5, R-P5bG-1; no number changed): the cut may instead be a CLOUD-CONFIG video-tuple change (preset/record/segmentSeconds/encoder) — then, in place of `never respawned`: on BOTH sides the capture is respawned for a NEW session at/after the player's release r of a tape `mqtt_in` record on `…/config` (the latest before both ends), BOTH end instants lie in [r, r + endMs], and neither side published a powerShed/liveBlock change within ±tickMs of r; (c)+(d) unchanged. A local edit (the 5 s settings poll), a release on another topic, an end before r or > endMs after it, a one-sided or same-session respawn, a kill, or a shed near r stay UNTOLERATED. Every other fragment keeps T12's ±150 ms (GOP boundaries at both ends)"
basis = "review-wp6 M3 (F1): a cut fragment's duration = stop − session start; the stop is one instant for both agents (the player SIGTERMs both together, play.rs) and the session start follows each agent's own phase — boot skew, or the shed tick (manager.ts:612-615) for a transition-started session — which T12 never bounded (replay-20261019T231240Z 7066/6895, review run 3 5191/5388 in plain `media`). The end instant carries the stop jitter only (T12's 150 ms); the start is judged by startTs-vs-PLAYING (T12) and the T4 transition rule. Config arm (R-P5bG-1): ts:src/worker.ts:960-980 @09da38d (the config handler applies the document and calls recording.reapply() synchronously) → ts:src/recording/manager.ts:344-349 reapply → apply → applyVideo :486-627 (the key holds preset/seg/record/encoder :570-580; a changed key chains prev.stopAndWait() at once :620-626, then startVideo) — so the cut is the shared release of the config record, like the stop's SIGTERM; the 5 s poll (:327) only serves local edits. Phase 5b gate D3 FINAL rec-preset .jsrs09/.jsrs09r2 cam1#0/00006: durations 4079/4239 and 4046/4208 (JS session started 104–168 ms later under host load), ends r+14/r+70 and r+10/r+4; every cut fragment of the three runs (cam0 + cam1) ends 4–70 ms after r. Pinned by media_diff::tests::t12_cut_fragment_covers_a_config_preset_cut_only (8 negatives)"
kind = "media"
streams = ["sidecar"]
tolerance = { "endMs" = 150.0, "tickMs" = 1100.0 }

