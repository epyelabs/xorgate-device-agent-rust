# Rig broker: TLS + MQTT 5 + client certificates required, like AWS IoT Core
# (minus policies: no ACLs in the rig). Certificates from gen-certs.sh.
per_listener_settings false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
allow_anonymous true
