# WP0a tooling lint (tools/imu only).
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "I", "UP"]

[lint.per-file-ignores]
# Synthetic strace fixture lines are long by nature.
"tests/test_imutx.py" = ["E501"]

[lint.isort]
known-first-party = ["bno085_read", "imutx", "scrub_imutx", "synth"]
