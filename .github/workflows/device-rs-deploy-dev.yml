name: Device (Rust) — deploy dev

# Builds the Rust device agent and uploads its dist tarball to the dev S3 bucket
# (xorgate-device-dist-dev-<account>-<region>) — the SAME bucket the JS agent's
# device-deploy-dev.yml publishes to, under `-rs` keys only:
#
#   xorgate-agent-rs-<sha>.tar.gz          immutable
#   xorgate-agent-rs-<sha>.tar.gz.sha256   sidecar, `sha256sum -c` format
#   xorgate-agent-rs-latest.tar.gz         alias (what `xorgate-rs update` pulls)
#   xorgate-agent-rs-latest.tar.gz.sha256
#   install-rs.sh                          the converter (Phase 5; byte-equal to the
#   install-rs.sh.sha256                   copy inside the versioned tarball)
#   latest-rs.json                         manifest, same field set as latest.json
#                                          (bytes from scripts/dist-manifest.sh)
#
# Every key passes scripts/dist-guard.sh before its write; after the upload
# scripts/dist-check.sh re-reads everything anonymously (what a device sees).
#
# NEVER write `latest.json` or any `xorgate-agent-<sha>` key without `-rs`:
# those belong to the JS agent and the console's `GET /device-dist/latest`
# keeps meaning the JS build until the cutover plan flips it (README §6, Q7).
#
# # Prerequisites (one-time, manual — same model as the JS repo)
#
# Each stage has its own AWS account and its own machine user, delivered via
# GitHub ENVIRONMENT secrets: the `development` environment holds the
# dev-account user's keys (this workflow), `production` holds the prod-account
# user's (device-rs-deploy-prod.yml). Same secret names in both; the job's
# `environment:` selects which set a run gets.
#
#   1. An IAM machine user in the DEV account (111910761410) with an inline
#      policy granting:
#        - s3:PutObject, s3:PutObjectAcl, s3:DeleteObject on the dev dist
#          bucket ("/*" suffix)
#        - s3:ListBucket on the dev dist bucket (no suffix)
#        - cloudformation:DescribeStacks on XorgateCoreStorageStackDev (so we
#          read the dist bucket name from the stack output instead of
#          hard-coding it)
#      The JS repo's dev machine user already has exactly this (its policy is
#      keyed on the bucket, not on object names), so the same key pair can be
#      reused for this repo.
#   2. Store as ENVIRONMENT secrets on `development` (Settings → Environments):
#        AWS_ACCESS_KEY_ID     = AKIA…
#        AWS_SECRET_ACCESS_KEY = the secret half
#      Optional repo VARIABLE (Variables tab), defaults to us-east-1:
#        AWS_REGION            = us-east-1
#
# Static keys are a temporary measure; migrate to GitHub OIDC later.
#
# Build recipe = ci.yml (arm64 runner + debian:bookworm container; see the
# container gotchas documented there). Keep the apt list in sync with ci.yml
# and Dockerfile.build.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "systemd/**"
      - "scripts/**"
      - "python/**"
      - "modem/**"
      - "media/**"
      - "system/**"
      - ".github/workflows/device-rs-deploy-dev.yml"
      # Phase 5 Q9 (CI-minute economy): bench tooling and docs are never
      # shipped, so a change touching ONLY them publishes nothing. Negations
      # must stay after the positive patterns (GitHub evaluates in order).
      - "!scripts/bench/**"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-rs-deploy-dev
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_HOME: /usr/local/rustup
  CARGO_HOME: /usr/local/cargo

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    environment: development # scopes secrets.AWS_* to the dev-account machine user
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev lld \
            awscli
          git config --global --add safe.directory '*'
          pkg-config --modversion gstreamer-1.0
          aws --version

      - uses: actions/checkout@v5

      - name: Install rustup (toolchain from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::rust-toolchain.toml is missing — the workspace must pin its toolchain (plan Phase 0)"
            exit 1
          fi
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Phase 7c review-wp3 FC1: the TEST-ONLY `imu-test-bus` feature (the IMU
      # reader's socket test transport) must never reach a shipped build:
      # `cargo tree` for both shipped targets (aarch64 device, x86_64 simulator;
      # neither target's std is needed), a dev-edge control, and the release
      # `compile_error!` guard (a `cargo check --release` that must FAIL).
      - name: Feature gate (imu-test-bus is test-only)
        run: bash scripts/tests/cargo/feature-gate.sh

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --release
        run: |
          cargo build --release
          ls -l target/release/xorgate-rs
          ldd target/release/xorgate-rs | grep -E 'gstreamer|libc\.so' || true

      # build-info.json {version:<short sha>, channel:"dev", builtAt, packageVersion}
      # is baked INTO the artifact (same reason as the JS workflow: a device
      # must be able to say which build it runs), then pack.sh builds
      # xorgate-agent-rs-<sha>.tar.gz with bin/ build-info.json systemd/ (+
      # python/ modem/ media/ system/ once they exist) and its .sha256.
      - name: Stamp build-info.json (channel dev)
        run: scripts/build-info.sh dev

      - name: Pack tarball
        id: pack
        run: scripts/pack.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve dist bucket from CloudFormation
        id: bucket
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          STACK: XorgateCoreStorageStackDev
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DeviceDistBucketName'].OutputValue" \
            --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "could not resolve DeviceDistBucketName from $STACK"
            exit 1
          fi
          echo "Using dist bucket: $BUCKET"
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"
          # The base URL devices are handed (agent.env DEVICE_DIST_BUCKET_URL =
          # the backend Lambda env = https://<bucketRegionalDomainName>, the
          # same value as this stack's DeviceDistBucketUrl output). Used only
          # by the anonymous checks below; nothing is written through it.
          URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DeviceDistBucketUrl'].OutputValue" \
            --output text)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            URL="https://$BUCKET.s3.$REGION.amazonaws.com"
          fi
          URL=${URL%/}
          echo "Device-facing dist URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Phase 5 (§7): the JS manifest's ETag BEFORE this run's writes, so the
      # post-upload check can prove no JS key was touched (anonymous HEAD).
      - name: Capture the JS latest.json ETag (before)
        id: jsetag
        env:
          URL: ${{ steps.bucket.outputs.url }}
        run: |
          ETAG=$(scripts/dist-check.sh --js-etag-of "$URL")
          echo "JS latest.json ETag before: $ETAG"
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"

      # Phase 5 (§6/§7): every key passes scripts/dist-guard.sh (the -rs
      # allow-list; never latest.json or a JS xorgate-agent-<v> key) right before
      # its write. All local files are built first, so a refusal or a failed
      # build writes nothing. Order: versioned + sidecar -> alias + sidecar ->
      # install-rs.sh + sidecar -> latest-rs.json LAST. A device reading the
      # alias between two puts can see a mismatched sidecar: it fails closed
      # and succeeds on retry (accepted posture, §6).
      - name: Upload to S3 (versioned + latest + install-rs.sh, -rs keys only)
        # bash: the job runs in `container: debian:bookworm`, where GitHub's
        # default run shell is `sh -e` (dash) -- no pipefail, no <<<.
        shell: bash
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_PATH: ${{ steps.pack.outputs.path }}
          VERSION: ${{ steps.pack.outputs.version }}
          BUILT_AT: ${{ steps.pack.outputs.builtAt }}
          PKG_VERSION: ${{ steps.pack.outputs.packageVersion }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          scripts/dist-guard.sh "$TARBALL"
          OUT=dist-rs; rm -rf "$OUT"; mkdir -p "$OUT"
          # install-rs.sh as published = the immutable copy INSIDE this tarball
          # (scripts/pack.sh ships it at the root; dist-check.sh verifies the
          # bucket copy stays byte-identical to it).
          LISTING=$(tar -tzf "$TARBALL_PATH")
          grep -qx install-rs.sh <<<"$LISTING" || { echo "::error::$TARBALL has no install-rs.sh member (pack.sh must ship it)"; exit 1; }
          tar -xzf "$TARBALL_PATH" -C "$OUT" install-rs.sh
          printf '%s  %s\n' "$(sha256sum "$OUT/install-rs.sh" | cut -d' ' -f1)" install-rs.sh > "$OUT/install-rs.sh.sha256"
          # The alias sidecar names the alias basename (sha256sum -c works on it).
          printf '%s  %s\n' "$SHA256" "xorgate-agent-rs-latest.tar.gz" > "$OUT/latest-rs.sha256"
          # latest-rs.json: frozen 5-field bytes (Q7), describing exactly what
          # the alias points at; dist-manifest.sh refuses a tarball that is not
          # this run's versioned key.
          scripts/dist-manifest.sh --version "$VERSION" --channel dev --built-at "$BUILT_AT" \
            --package-version "$PKG_VERSION" --tarball "$TARBALL" > "$OUT/latest-rs.json"
          cat "$OUT/latest-rs.json"
          put() { # <local file> <key> <cache-control> <content-type>
            scripts/dist-guard.sh "$2"
            aws s3 cp "$1" "s3://$BUCKET/$2" --cache-control "$3" --content-type "$4"
          }
          IMMUTABLE="public,max-age=31536000,immutable"
          # Versioned tarball: immutable, cache forever.
          put "$TARBALL_PATH" "$TARBALL" "$IMMUTABLE" application/gzip
          put "$TARBALL_PATH.sha256" "$TARBALL.sha256" "$IMMUTABLE" text/plain
          # `latest` alias: what `xorgate-rs update` pulls by default.
          put "$TARBALL_PATH" xorgate-agent-rs-latest.tar.gz no-cache application/gzip
          put "$OUT/latest-rs.sha256" xorgate-agent-rs-latest.tar.gz.sha256 no-cache text/plain
          # The converter (bootstrap one-liner, phase-5 Q3); no-cache: the
          # immutable copy is the one inside every versioned tarball.
          put "$OUT/install-rs.sh" install-rs.sh no-cache text/x-shellscript
          put "$OUT/install-rs.sh.sha256" install-rs.sh.sha256 no-cache text/plain
          # Manifest last.
          put "$OUT/latest-rs.json" latest-rs.json no-cache application/json

      # Phase 5 (§7, G5/G12): what a device sees, anonymously — every key 200,
      # sidecars verify, alias == versioned, latest-rs.json schema + version,
      # install-rs.sh == the tarball's copy, JS latest.json ETag unchanged.
      - name: Anonymous post-upload check (scripts/dist-check.sh)
        env:
          URL: ${{ steps.bucket.outputs.url }}
          VERSION: ${{ steps.pack.outputs.version }}
          JS_ETAG: ${{ steps.jsetag.outputs.etag }}
        run: scripts/dist-check.sh "$URL" "$VERSION" --channel dev --js-etag "$JS_ETAG"

      - name: Summary
        if: always()
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
          URL: ${{ steps.bucket.outputs.url }}
          VERSION: ${{ steps.pack.outputs.version }}
          BIN_BYTES: ${{ steps.pack.outputs.binaryBytes }}
          TAR_BYTES: ${{ steps.pack.outputs.tarballBytes }}
        run: |
          {
            echo "## Device (Rust) dev deploy"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Bucket: \`$BUCKET\`"
            echo "- Binary: $BIN_BYTES bytes, tarball: $TAR_BYTES bytes"
            echo "- Tarballs:"
            echo "  - \`s3://$BUCKET/xorgate-agent-rs-$VERSION.tar.gz\` (immutable, + .sha256)"
            echo "  - \`s3://$BUCKET/xorgate-agent-rs-latest.tar.gz\` (alias, + .sha256)"
            echo "- Converter: \`s3://$BUCKET/install-rs.sh\` (+ .sha256; the immutable copy is inside the tarball)"
            echo "- Manifest: \`s3://$BUCKET/latest-rs.json\`"
            echo "- Device-facing URL: \`$URL\` (checked anonymously by scripts/dist-check.sh)"
          } >> "$GITHUB_STEP_SUMMARY"
